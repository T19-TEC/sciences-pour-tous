/* ==================================================================
   8octies. RENDEZ-VOUS
   ================================================================== */
const MODE_LABEL = { visio: "En visio", presentiel: "En présentiel" };

function slotLabel(iso, minutes) {
  const d = new Date(iso);
  const jour = d.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });
  const heure = d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
  return `${jour} à ${heure}${minutes ? ` · ${minutes} min` : ""}`;
}

/* --- Bloc rendez-vous vu par l'élève ----------------------------- */
function MesRdv({ me, compact }) {
  const [rows, setRows] = useState([]);
  const [slots, setSlots] = useState({});
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => { load(); }, []);

  async function load() {
    const { data, error } = await db.from("meetings_view")
      .select("*").eq("student_id", me.id)
      .in("status", ["propose", "confirme"]).order("created_at", { ascending:false });
    if (error) { setErr(error.message); return; }
    setRows(data || []);
    if ((data || []).length) {
      const { data: sl } = await db.from("meeting_slots")
        .select("*").in("meeting_id", data.map((m) => m.id)).order("starts_at");
      const by = {};
      (sl || []).forEach((s) => { (by[s.meeting_id] ||= []).push(s); });
      setSlots(by);
    }
  }

  async function pick(slotId, mode) {
    setBusy(true); setErr("");
    const { data, error } = await db.rpc("choose_slot", { slot: slotId, pick_mode: mode });
    if (error) setErr(error.message);
    else if (data === false) setErr("Ce rendez-vous n'est plus disponible.");
    await load(); setBusy(false);
  }

  async function cancel(id) {
    if (!confirm("Annuler ce rendez-vous ?")) return;
    await db.rpc("cancel_meeting", { mid: id });
    await load();
  }

  if (rows.length === 0) {
    if (compact) return null;
    return html`<div class="card">
      <p class="eyebrow" style="margin-bottom:var(--s2)">Points avec ton encadrant</p>
      <p class="muted">Aucun rendez-vous prévu. Ton encadrant t'en proposera un,
        ou demande-lui directement dans la messagerie.</p></div>`;
  }

  return html`<div>
    ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}
    ${rows.map((m) => {
      const list = slots[m.id] || [];
      const chosen = list.find((s) => s.chosen);
      return html`<div class="card" key=${m.id}>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap">
          <div>
            <p class="eyebrow">${m.status === "confirme" ? "Rendez-vous confirmé" : "Proposition de rendez-vous"}</p>
            <p style="font-size:16px;margin-top:var(--s1)">${m.subject || "Point de suivi"}</p>
            <p class="muted">avec ${m.staff_name}</p>
          </div>
          <${Avatar} name=${m.staff_name} path=${m.staff_avatar} size=${40} />
        </div>

        ${m.note && html`<p class="muted" style="margin-top:var(--s3);white-space:pre-wrap">${m.note}</p>`}

        ${m.status === "confirme"
          ? html`<div style="margin-top:var(--s3)">
              <div class="slot chosen">
                <span>${chosen ? slotLabel(chosen.starts_at, chosen.minutes) : "Créneau à confirmer"}</span>
                <span class="pill live">${MODE_LABEL[m.mode] || ""}</span>
              </div>
              ${m.location && html`<p class="muted" style="margin-top:var(--s2)">
                ${m.mode === "visio" ? "Lien : " : "Lieu : "}
                ${m.mode === "visio"
                  ? html`<a href=${m.location} target="_blank" rel="noopener">${m.location}</a>`
                  : m.location}</p>`}
              <button class="ghost tiny" style="margin-top:var(--s3)" onClick=${() => cancel(m.id)}>
                Annuler ce rendez-vous</button>
            </div>`
          : html`<div style="margin-top:var(--s3)">
              <p class="muted" style="margin-bottom:var(--s2)">
                Choisis le créneau et le format qui t'arrangent.</p>
              ${list.map((s) => html`<div class="slot" key=${s.id}>
                <span>${slotLabel(s.starts_at, s.minutes)}</span>
                <span style="display:flex;gap:var(--s2)">
                  ${(m.modes || []).map((md) => html`<button key=${md} class="ghost tiny" disabled=${busy}
                    onClick=${() => pick(s.id, md)}>${MODE_LABEL[md]}</button>`)}
                </span>
              </div>`)}
              ${list.length === 0 && html`<p class="muted">Aucun créneau proposé pour l'instant.</p>`}
            </div>`}
      </div>`;
    })}
  </div>`;
}

/* --- Proposition d'un rendez-vous par l'encadrant ---------------- */
const EMPTY_RDV = { subject:"", note:"", location:"", modes:["visio","presentiel"], slots:["", "", ""] };

function ProposerRdv({ me, student, onDone }) {
  const [f, setF] = useState({ ...EMPTY_RDV, slots:["", "", ""] });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function send() {
    const dates = f.slots.filter((s) => s);
    if (dates.length === 0) { setErr("Propose au moins un créneau."); return; }
    if (f.modes.length === 0) { setErr("Propose au moins un format."); return; }
    setBusy(true); setErr("");

    const { data: m, error } = await db.from("meetings").insert({
      student_id: student.id, staff_id: me.id, proposed_by: me.id,
      modes: f.modes, subject: f.subject.trim() || null,
      note: f.note.trim() || null, location: f.location.trim() || null,
    }).select().single();

    if (error) { setErr(error.message); setBusy(false); return; }

    const { error: e2 } = await db.from("meeting_slots").insert(
      dates.map((d) => ({ meeting_id: m.id, starts_at: new Date(d).toISOString(), minutes: 45 })));
    if (e2) setErr(e2.message);
    else { setF({ ...EMPTY_RDV, slots:["", "", ""] }); onDone(); }
    setBusy(false);
  }

  const toggleMode = (md) => setF({ ...f,
    modes: f.modes.includes(md) ? f.modes.filter((x) => x !== md) : [...f.modes, md] });

  return html`<div class="card">
    <p class="eyebrow" style="margin-bottom:var(--s3)">Proposer un point à ${student.full_name}</p>
    <div class="field"><label>Objet</label>
      <input value=${f.subject} onInput=${(e)=>setF({...f,subject:e.target.value})}
        placeholder="Point mensuel, retour sur la dissertation…" /></div>
    <div class="field"><label>Formats proposés</label>
      <div class="tags">
        ${["visio","presentiel"].map((md) => html`<span key=${md}
          class=${"tag" + (f.modes.includes(md) ? " on" : "")}
          onClick=${() => toggleMode(md)}>${MODE_LABEL[md]}</span>`)}
      </div></div>
    <div class="field"><label>Créneaux proposés — l'élève en choisira un</label>
      ${f.slots.map((s, i) => html`<input key=${i} type="datetime-local" value=${s}
        style="margin-bottom:var(--s2)"
        onInput=${(e) => { const n=[...f.slots]; n[i]=e.target.value; setF({...f,slots:n}); }} />`)}
    </div>
    <div class="field"><label>Lien visio ou adresse (facultatif)</label>
      <input value=${f.location} onInput=${(e)=>setF({...f,location:e.target.value})} /></div>
    <div class="field"><label>Message (facultatif)</label>
      <textarea value=${f.note} onInput=${(e)=>setF({...f,note:e.target.value})}></textarea></div>
    ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}
    <button disabled=${busy} onClick=${send}>Envoyer la proposition</button>
  </div>`;
}

/* --- Bloc rendez-vous dans la fiche élève ------------------------ */
function RdvFiche({ me, student }) {
  const [rows, setRows] = useState([]);
  const [slots, setSlots] = useState({});
  const [open, setOpen] = useState(false);

      ${upcoming.length === 0 && html`<p class="muted">Aucun point prévu.</p>`}

        return html`<div class="row" key=${m.id}>

            <span style="font-size:14px">${m.subject || "Point de suivi"}</span>
            <span class="muted" style="display:block">
              ${m.status === "confirme"
                ? `${chosen ? slotLabel(chosen.starts_at, chosen.minutes) : "créneau à venir"} · ${MODE_LABEL[m.mode] || ""}`
                : `${list.length} créneau${list.length > 1 ? "x" : ""} proposé${list.length > 1 ? "s" : ""} — en attente de l'élève`}</span>
          </div>
          <span class=${"pill " + (m.status === "confirme" ? "live" : "wait")}>
            ${m.status === "confirme" ? "confirmé" : "proposé"}</span>
        </div>`;
      })}
      ${past.length > 0 && html`<p class="muted" style="margin-top:var(--s3)">
        ${past.length} point${past.length > 1 ? "s" : ""} passé${past.length > 1 ? "s" : ""} ou annulé${past.length > 1 ? "s" : ""}.</p>`}
    </div>
    ${open && html`<${ProposerRdv} me=${me} student=${student}
      onDone=${() => { setOpen(false); load(); }} />`}
  </div>`;
}

function Stat({ value, label, warn }) {
  return html`<div class=${"stat" + (warn ? " warn-stat" : "")}>
    <b>${value}</b><span>${label}</span></div>`;
}

function BordEncadrant({ me, rows, onOpen, onReport }) {
  const [s, setS] = useState(null);
  const [follow, setFollow] = useState([]);
  const [rdv, setRdv] = useState([]);
  const [serie, setSerie] = useState([]);
  const [grade, setGrade] = useState(null);

  useEffect(() => { load(); }, []);

  async function load() {
    const { data } = await db.rpc("staff_stats");
    setS(Array.isArray(data) ? data[0] : data);
    const { data: f } = await db.from("follow_up").select("*").eq("tutor_id", me.id);
    setFollow(f || []);
    const { data: m } = await db.from("meetings_view")
      .select("*").eq("staff_id", me.id).eq("status", "confirme").order("when_at");
    setRdv((m || []).filter((x) => x.when_at && new Date(x.when_at) > Date.now()));
    const { data: sr } = await db.rpc("activity_series");
    setSerie(sr || []);
    const { data: g } = await db.rpc("my_grade");
    setGrade(Array.isArray(g) ? g[0] : g);
  }

  if (!s) return html`<p class="muted">Chargement du tableau de bord…</p>`;

  const days = (d) => d ? Math.floor((Date.now() - new Date(d)) / 86400000) : null;
  const byId = Object.fromEntries(follow.map((f) => [f.student_id, f]));

  // Une carte par élève : peu d'élèves, donc autant tout montrer d'un coup.
  const eleves = rows.map((r) => {
    const f = byId[r.id] || {};
    const seen = days(f.last_seen), met = days(f.last_meeting);
    const alerts = [];
    if (seen === null || seen > 14) alerts.push({ t:"hot", l: seen === null ? "jamais venu" : `absent depuis ${seen} j` });
    if (met === null || met > 30)   alerts.push({ t:"hot", l: met === null ? "aucun point tenu" : `dernier point il y a ${met} j` });
    if (r.unread > 0)               alerts.push({ t:"hot", l: `${r.unread} message${r.unread > 1 ? "s" : ""} non lu${r.unread > 1 ? "s" : ""}` });
    if (f.next_meeting)             alerts.push({ t:"ok",  l: `point le ${dateFr(f.next_meeting)}` });
    if (seen !== null && seen <= 2) alerts.push({ t:"fire", l: "actif cette semaine" });
    return { ...r, f, alerts, urgent: alerts.some((a) => a.t === "hot") };
  }).sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0));

  return html`
    <div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)">
        <div>
          <h1 style="font-size:26px">Bonjour ${me.full_name.split(" ")[0]}</h1>
          <p class="muted">L'essentiel de ton accompagnement, en un coup d'œil.</p>
        </div>
        <button class="ghost" onClick=${onReport}>Un souci, une idée ?</button>
      </div>

      <div class="stats" style="margin-bottom:var(--s5)">
        <${Stat} value=${s.my_students} label="élèves suivis" />
        <${Stat} value=${s.to_correct} label="copies libres" warn=${s.to_correct > 0} />
        <${Stat} value=${s.claimed_by_me} label="copies prises" warn=${s.claimed_by_me > 0} />
        <${Stat} value=${s.unread} label="messages non lus" warn=${s.unread > 0} />
      </div>

      ${grade && html`<div class="card" style="margin-bottom:var(--s5)">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);flex-wrap:wrap">
          <div>
            <p class="eyebrow">Ton grade</p>
            <p style="font-family:var(--serif);font-size:22px;margin-top:var(--s1)">
              ${grade.name} <span class="muted" style="font-size:13px">niveau ${grade.level} sur 7</span></p>
            <p class="muted">${grade.description}</p>
          </div>
          <p style="font-family:var(--serif);font-size:26px">${grade.points}<span class="muted" style="font-size:13px"> pts</span></p>
        </div>
        ${grade.next_name && html`
          <div class="track dark" style="margin-top:var(--s3)">
            <i style=${`width:${Math.min(100, Math.round((grade.points / grade.next_points) * 100))}%`}></i></div>
          <p class="muted" style="margin-top:var(--s2)">
            Encore ${Math.max(0, grade.next_points - grade.points)} points pour devenir ${grade.next_name}.</p>`}
      </div>`}

      <p class="eyebrow" style="margin-bottom:var(--s3)">Mes élèves</p>
      ${eleves.length === 0
        ? html`<div class="card"><p class="muted">Aucun élève ne t'est rattaché pour l'instant.</p></div>`
        : html`<div class="cards" style="margin-bottom:var(--s5)">
            ${eleves.map((e) => html`<button class=${"scard" + (e.urgent ? " alert" : "")}
              key=${e.id} onClick=${() => onOpen(e.id)}>
              <div style="display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)">
                <span style="font-size:15px">${e.full_name}</span>
                <span class="muted" style="font-size:12px">${e.xp} XP</span>
              </div>
              <div class="track dark" style="margin-top:var(--s2)">
                <i style=${`width:${Math.min(100, e.lessons_done * 8)}%`}></i></div>
              <p class="muted" style="margin-top:var(--s1);font-size:12px">
                ${e.lessons_done} leçons · ${e.f.last_seen ? `vu le ${dateFr(e.f.last_seen)}` : "jamais venu"}</p>
              <div class="chips">
                ${e.alerts.slice(0, 3).map((a, i) => html`<span key=${i} class=${"chip " + a.t}>${a.l}</span>`)}
              </div>
            </button>`)}
          </div>`}

      <div class="split">
        <div class="card">
          <p class="eyebrow" style="margin-bottom:var(--s3)">Activité de l'association</p>
          <${Barres} data=${serie} keyName="actives" legend="élèves connectés par jour" />
        </div>
        <div class="card">
          <p class="eyebrow" style="margin-bottom:var(--s3)">Prochains points</p>
          ${rdv.length === 0 && html`<p class="muted">Aucun rendez-vous confirmé.</p>`}
          ${rdv.slice(0, 4).map((m) => html`<div class="row" key=${m.id}>
            <div style="min-width:0"><span style="font-size:14px">${m.student_name}</span>
              <span class="muted" style="display:block">
                ${slotLabel(m.when_at, m.chosen_minutes)}</span></div>
          </div>`)}
        </div>
      </div>

      <div style="margin-top:var(--s3)"><${MesSignalements} me=${me} /></div>
    </div>`;
}

/* --- Onglet Rappel : alertes de suivi et engagement du mois ------- */
function Rappel({ me, rows, onOpen }) {
  const [follow, setFollow] = useState([]);
  const [month, setMonth] = useState(monthStart(1));
  const [av, setAv] = useState({ hours_per_week:"", note:"" });
  const [saved, setSaved] = useState(false);
  const [msg, setMsg] = useState("");

  useEffect(() => { load(); }, []);
  useEffect(() => { loadAv(month); }, [month]);

  async function load() {
    const { data } = await db.from("follow_up").select("*").eq("tutor_id", me.id);
    setFollow(data || []);
  }

  async function loadAv(m) {
    const { data } = await db.from("staff_availability")
      .select("hours_per_week, note").eq("user_id", me.id).eq("month", m).maybeSingle();
    setAv({ hours_per_week: data?.hours_per_week ?? "", note: data?.note || "" });
    setSaved(!!data);
  }

  async function save() {
    const { error } = await db.from("staff_availability").upsert({
      user_id: me.id, month,
      hours_per_week: Number(av.hours_per_week) || 0,
      note: av.note?.trim() || null, updated_at: new Date().toISOString(),
    }, { onConflict: "user_id,month" });
    if (!error) { setMsg(`Engagement enregistré pour ${monthLabel(month)}.`); setSaved(true); }
  }

  const days = (d) => d ? Math.floor((Date.now() - new Date(d)) / 86400000) : null;
  const byId = Object.fromEntries(follow.map((f) => [f.student_id, f]));

  const alertes = rows.map((r) => {
    const f = byId[r.id] || {};
    const seen = days(f.last_seen), met = days(f.last_meeting);
    const raisons = [];
    if (seen === null) raisons.push("ne s'est jamais connecté");
    else if (seen > 14) raisons.push(`absent depuis ${seen} jours`);
    if (met === null) raisons.push("aucun point tenu à ce jour");
    else if (met > 30) raisons.push(`dernier point il y a ${met} jours`);
    if (r.unread > 0) raisons.push(`${r.unread} message${r.unread > 1 ? "s" : ""} sans réponse`);
    return { ...r, raisons, next: f.next_meeting };
  }).filter((x) => x.raisons.length > 0);

  const jour = new Date().getDate();
  const periode = jour >= 15;

  return html`
    <div>
      <h1 style="font-size:26px">Rappels</h1>
      <p class="muted" style="margin-bottom:var(--s4)">
        Ce qui demande ton attention, et ton engagement pour le mois qui vient.</p>

      ${alertes.length === 0
        ? html`<div class="card"><p class="muted">
            Aucune alerte. Tous tes élèves sont vus, suivis et à jour.</p></div>`
        : html`<div class="card">
            <p class="eyebrow" style="margin-bottom:var(--s3)">
              ${alertes.length} élève${alertes.length > 1 ? "s" : ""} à relancer</p>
            ${alertes.map((a) => html`<div class="row" key=${a.id}>
              <div style="min-width:0">
                <span style="font-size:14px">${a.full_name}</span>
                <span class="muted" style="display:block">${a.raisons.join(" · ")}</span>
              </div>
              <button class="ghost tiny" onClick=${() => onOpen(a.id)}>Ouvrir la fiche</button>
            </div>`)}
          </div>`}

      <div class="card">
        <p class="eyebrow" style="margin-bottom:var(--s2)">Mon engagement</p>
        ${periode && !saved && html`<p class="warn" style="margin-bottom:var(--s3)">
          Nous sommes en seconde quinzaine : c'est le moment de déclarer ta disponibilité
          pour ${monthLabel(monthStart(1))}. Le bureau en a besoin pour répartir les élèves.</p>`}

        <div class="split">
          <div>
            <div class="field"><label>Mois concerné</label>
              <select value=${month} onChange=${(e) => { setMonth(e.target.value); setMsg(""); }}>
                ${[0,1,2].map((o) => html`<option key=${o} value=${monthStart(o)}>${monthLabel(monthStart(o))}</option>`)}
              </select></div>
            <div class="field"><label>Heures par semaine — objectif 7</label>
              <input type="range" min="0" max="7" step="0.5" value=${av.hours_per_week || 0}
                onInput=${(e) => setAv({ ...av, hours_per_week:e.target.value })} /></div>
            <div class="field"><label>Indisponibilités, remarques</label>
              <textarea value=${av.note} onInput=${(e) => setAv({ ...av, note:e.target.value })}
                placeholder="Plutôt le week-end · absent la semaine du 12 · je peux prendre un élève de plus…"></textarea></div>
            <button onClick=${save}>Enregistrer mon engagement</button>
            ${msg && html`<p class="notice">${msg}</p>`}
          </div>
          <div style="display:flex;align-items:center;justify-content:center">
            <${Jauge} value=${av.hours_per_week || 0} max=${7} />
          </div>
        </div>

        <p class="muted" style="margin-top:var(--s3)">
          Sept heures par semaine, c'est l'engagement d'un encadrant pleinement disponible.
          Mieux vaut annoncer deux heures et les tenir que sept et décrocher — le bureau
          répartit les élèves d'après ce que tu déclares.</p>
      </div>
    </div>`;
}

/* Jauge d'engagement, façon compteur de bord. Objectif : 7 h/semaine. */
function Jauge({ value, max = 7, size = 190, label }) {
  const v = Math.max(0, Math.min(Number(value) || 0, max));
  const r = 68, cx = 95, cy = 100;
  const ang = Math.PI * (1 - v / max);
  const px = cx + r * Math.cos(ang), py = cy - r * Math.sin(ang);
  const nx = cx + (r - 16) * Math.cos(ang), ny = cy - (r - 16) * Math.sin(ang);
  const col = v >= max ? "var(--ok)" : v >= max * 0.6 ? "var(--xp-bright)" : "var(--gray-soft)";

  return html`<div style="text-align:center">
    <svg viewBox="0 0 190 130" style=${`width:${size}px;max-width:100%`} role="img"
         aria-label=${`${v} heures par semaine sur un objectif de ${max}`}>
      <path d=${`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`}
            fill="none" stroke="var(--line)" stroke-width="13" stroke-linecap="round" />
      ${v > 0 && html`<path d=${`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${px} ${py}`}
            fill="none" stroke=${col} stroke-width="13" stroke-linecap="round" />`}
      <line x1=${cx} y1=${cy} x2=${nx} y2=${ny} stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" />
      <circle cx=${cx} cy=${cy} r="5" fill="var(--ink)" />
      <text x=${cx} y="72" text-anchor="middle" font-family="Georgia, serif" font-size="30"
            fill="var(--ink)">${v}</text>
      <text x=${cx - r} y=${cy + 18} text-anchor="middle" font-size="11" fill="var(--gray-soft)">0</text>
      <text x=${cx + r} y=${cy + 18} text-anchor="middle" font-size="11" fill="var(--gray-soft)">${max}</text>
    </svg>
    <p class="muted" style="margin-top:-6px">${label || "heures par semaine"}</p>
  </div>`;
}

/* Histogramme sobre : une barre par jour. */
function Barres({ data, keyName, legend }) {
  const max = Math.max(1, ...data.map((d) => d[keyName] || 0));
  return html`<div>
    <div class="bars">
      ${data.map((d, i) => html`<div key=${i}
        class=${i >= data.length - 7 ? "" : "soft"}
        style=${`height:${Math.round(((d[keyName] || 0) / max) * 100)}%`}
        title=${`${dateFr(d.day)} — ${d[keyName] || 0}`}></div>`)}
    </div>
    <div class="axis">
      <span>${data.length ? dateFr(data[0].day) : ""}</span>
      <span>${legend}</span>
      <span>aujourd'hui</span>
    </div>
  </div>`;
}

function MonCompte({ me, reload }) {
  const [d, setD] = useState(null);
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");
  const [mail, setMail] = useState("");

  useEffect(() => { load(); }, []);

  async function load() {
    const { data } = await db.from("student_details").select("*").eq("user_id", me.id).maybeSingle();
    setD(data || {});
    const { data: s } = await db.auth.getUser();
    setMail(s?.user?.email || "");
  }

  async function save() {
    setMsg(""); setErr("");
    const { error } = await db.from("student_details")
      .update({ discord: d.discord?.trim() || null, school: d.school?.trim() || null,
                phone: d.phone?.trim() || null })
      .eq("user_id", me.id);
    if (error) setErr(error.message);
    else { setMsg("Enregistré."); await load(); await reload(); }
  }

          <dt>Adhérent depuis</dt><dd>${dateFr(d.member_since)}</dd>
          <dt>Accord parental</dt><dd>${d.parent_consent_at ? `validé le ${dateFr(d.parent_consent_at)}` : "sans objet ou en attente"}</dd>
        </dl>

    </div>`;
}

/* ==================================================================
   8terdecies. SIGNALER UNE ANOMALIE OU PROPOSER UNE AMÉLIORATION
   ================================================================== */
function Signaler({ me, page, onClose }) {
  const [f, setF] = useState({ kind:"bug", title:"", body:"" });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [ok, setOk] = useState(false);

  async function send() {
    if (f.title.trim().length < 5) { setErr("Décris le sujet en quelques mots."); return; }
    setBusy(true); setErr("");
    const { error } = await db.from("reports").insert({
      kind: f.kind, title: f.title.trim(), body: f.body.trim() || null,
      page: page || null, author_id: me.id });
    if (error) setErr(error.message); else setOk(true);
    setBusy(false);
  }

  return html`<div class="veil" onClick=${(e) => e.target === e.currentTarget && onClose()}>
    <div class="modal">
      ${ok ? html`
        <h2 style="font-size:22px;margin-bottom:var(--s3)">Merci</h2>
        <p class="muted" style="margin-bottom:var(--s4)">
          Ton message est arrivé au bureau. Tu pourras suivre son traitement
          depuis ce même bouton.</p>
        <button onClick=${onClose}>Fermer</button>`
      : html`
        <h2 style="font-size:22px;margin-bottom:var(--s2)">Un souci, une idée ?</h2>
        <p class="muted" style="margin-bottom:var(--s4)">
          Tout ce qui te gêne ou te manque nous intéresse. C'est comme ça que
          la plateforme s'améliore.</p>
        <div class="field"><label>De quoi s'agit-il ?</label>
          <div class="tags">
            ${[["bug","Quelque chose ne marche pas"],["amelioration","J'ai une idée"]].map(([k,l]) =>
              html`<span key=${k} class=${"tag" + (f.kind === k ? " on" : "")}
                onClick=${() => setF({ ...f, kind:k })}>${l}</span>`)}
          </div></div>
        <div class="field"><label>En une phrase</label>
          <input value=${f.title} onInput=${(e) => setF({ ...f, title:e.target.value })}
            placeholder=${f.kind === "bug" ? "Le bouton X ne répond pas" : "On pourrait ajouter…"} /></div>
        <div class="field"><label>Détaille si tu peux</label>
          <textarea value=${f.body} onInput=${(e) => setF({ ...f, body:e.target.value })}
            placeholder="Ce que tu faisais, ce que tu attendais…"></textarea></div>
        ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}
        <div style="display:flex;gap:var(--s2)">
          <button disabled=${busy} onClick=${send}>Envoyer</button>
          <button class="ghost" onClick=${onClose}>Annuler</button>
        </div>`}
    </div>
  </div>`;
}

function Fiche({ me, studentId, courses, tutors, onBack, reload }) {
  const [p, setP] = useState(null);
  const [d, setD] = useState(null);
  const [doneIds, setDoneIds] = useState([]);
  const [notes, setNotes] = useState("");
  const [saved, setSaved] = useState("");
  const [err, setErr] = useState("");
  const isAdmin = me.role === "admin";

  useEffect(() => { load(); }, [studentId]);

  async function load() {
    const { data: prof } = await db.from("profiles")
      .select("id, full_name, role, status, tutor_id, created_at").eq("id", studentId).single();
    const { data: det, error: e2 } = await db.from("student_details")
      .select("*").eq("user_id", studentId).single();
    const { data: comp } = await db.from("lesson_completions")
      .select("lesson_id").eq("user_id", studentId);
    if (e2) setErr(e2.message);
    setP(prof); setD(det || {}); setNotes(det?.staff_notes || "");
    setDoneIds((comp || []).map((c) => c.lesson_id));
  }

  async function saveField(table, patch) {
    setSaved(""); setErr("");
    const q = table === "profiles"
      ? db.from("profiles").update(patch).eq("id", studentId)
      : db.from("student_details").update(patch).eq("user_id", studentId);
    const { error } = await q;
    if (error) setErr(error.message);
    else { setSaved("Enregistré."); await load(); await reload(); setTimeout(() => setSaved(""), 2500); }
  }

  if (!p || !d) return html`<p class="muted">Chargement de la fiche…</p>`;

  const done = new Set(doneIds);
  const xp = courses.flatMap((c) => c.lessons).filter((l) => done.has(l.id)).reduce((s,l)=>s+l.xp, 0);
  const age = ageFrom(d.birthdate);
  const minor = age !== null && age < 15;

  return html`
    <div>
      <button class="plain" onClick=${onBack}>← Retour à la liste</button>

      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin:var(--s3) 0 var(--s4)">

          <p class="muted">${ROLES[p.role]}${age !== null ? ` · ${age} ans` : ""} · inscrit ${dateFr(p.created_at)}</p>
        </div>
        <div style="display:flex;gap:var(--s2);align-items:center">
          <span class=${"pill " + (p.status==="active"?"live":p.status==="pending"?"wait":"off")}>
            ${p.status==="active"?"Compte actif":p.status==="pending"?"En attente":"Suspendu"}</span>
          ${isAdmin && p.status === "active" && html`
            <button class="ghost tiny" onClick=${() => saveField("profiles", { status:"suspended" })}>Suspendre</button>`}
          ${isAdmin && p.status !== "active" && html`
            <button class="ok tiny" onClick=${() => saveField("profiles", { status:"active" })}>Activer</button>`}
        </div>
      </div>

      ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}
      ${saved && html`<p class="notice" style="margin-bottom:var(--s3)">${saved}</p>`}

      <div class="split">
        <div>
          <div class="card">
            <p class="eyebrow" style="margin-bottom:var(--s3)">Progression</p>
            <div style="display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3)">
              <span style="font-family:var(--serif);font-size:28px">${xp}</span>
              <span class="muted">XP · niveau ${levelOf(xp)} · ${doneIds.length} leçons validées</span></div>
            ${courses.map((c) => {
              const n = c.lessons.filter((l) => done.has(l.id)).length;
              const pct = c.lessons.length ? Math.round((n/c.lessons.length)*100) : 0;
              return html`<div key=${c.id} style="margin-bottom:var(--s3)">
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:var(--s1)">
                  <span>${c.title}</span><span class="muted">${n}/${c.lessons.length}</span></div>
                <div class="track dark"><i style=${`width:${pct}%`}></i></div></div>`;
            })}
          </div>

          <${RdvFiche} me=${me} student=${p} />

          <${BadgesFiche} me=${me} studentId=${studentId} />

          <div class="card">
            <p class="eyebrow" style="margin-bottom:var(--s3)">Notes de suivi</p>
            <p class="muted" style="margin-bottom:var(--s2)">
              Visibles par l'encadrement uniquement. L'élève n'y a jamais accès.</p>
            <textarea value=${notes} onInput=${(e)=>setNotes(e.target.value)}
              placeholder="Points forts, difficultés, décisions prises en rendez-vous…"></textarea>
            <button class="ghost" style="margin-top:var(--s2)"
              onClick=${() => saveField("student_details", { staff_notes: notes })}>Enregistrer les notes</button>
          </div>
        </div>

        <div>

            <p class="eyebrow" style="margin-bottom:var(--s3)">Coordonnées</p>
            <dl class="dl">
              <dt>Naissance</dt><dd>${dateFr(d.birthdate)}</dd>
              <dt>Téléphone</dt><dd>${d.phone || "—"}</dd>
              <dt>Discord</dt><dd>${d.discord || "—"}</dd>
              <dt>Établissement</dt><dd>${d.school || "—"}</dd>
            </dl>
          </div>

          ${minor && html`<div class="card">
            <p class="eyebrow" style="margin-bottom:var(--s3)">Responsable légal</p>
            <dl class="dl">
              <dt>Nom</dt><dd>${d.parent_name || "—"}</dd>
              <dt>E-mail</dt><dd style="word-break:break-all">${d.parent_email || "—"}</dd>

          </div>`}

          <div class="card">
            <p class="eyebrow" style="margin-bottom:var(--s3)">Adhésion</p>
            <dl class="dl">
              <dt>Adhérent depuis</dt><dd>${dateFr(d.member_since)}</dd>
              <dt>Référence</dt><dd>${d.membership_ref || "—"}</dd>
            </dl>
            ${isAdmin && !d.member_since && html`<button class="ok tiny" style="margin-top:var(--s3)"
              onClick=${() => saveField("student_details", { member_since: new Date().toISOString().slice(0,10) })}>
              Enregistrer l'adhésion</button>`}
          </div>

          ${isAdmin && html`<div class="card">
            <p class="eyebrow" style="margin-bottom:var(--s3)">Rôle</p>
            <select value=${p.role} onChange=${(e) => saveField("profiles", { role: e.target.value })}>
              <option value="eleve">Élève</option>
              <option value="encadrant">Encadrant</option>
              <option value="admin">Bureau</option>
            </select>
            <p class="muted" style="margin-top:var(--s2)">
              Promouvoir en encadrant donne accès aux élèves rattachés et à la correction.</p>
          </div>`}

          ${isAdmin && html`<div class="card">
            <p class="eyebrow" style="margin-bottom:var(--s3)">Encadrant rattaché</p>
            <select value=${p.tutor_id || ""} onChange=${(e) =>
              saveField("profiles", { tutor_id: e.target.value || null })}>

              ${tutors.map((t) => html`<option key=${t.id} value=${t.id}>${t.full_name}</option>`)}

          </div>`}
        </div>
      </div>
    </div>`;
}

/* ==================================================================
   10. VALIDATION DES INSCRIPTIONS (BUREAU)
   ================================================================== */
function Validation({ onOpen, reload, team }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");

  useEffect(() => { load(); }, []);

  async function load() {
    setLoading(true);
    const { data, error } = await db.from("pending_review")
      .select("*").eq("status", "pending").order("created_at");
    if (error) setErr(error.message); else setRows(data || []);
    setLoading(false);
  }

  async function mark(id, patch, table) {
    const q = table === "profiles"
      ? db.from("profiles").update(patch).eq("id", id)
      : db.from("student_details").update(patch).eq("user_id", id);
    const { error } = await q;
    if (error) setErr(error.message); else { await load(); await reload(); }
  }

  return html`
    <div>
      <h1 style="font-size:26px">Inscriptions à valider</h1>
      <p class="muted" style="margin-bottom:var(--s4)">
        Un compte n'ouvre l'accès aux cours qu'une fois validé ici.</p>
      ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}
      ${loading && html`<p class="muted">Chargement…</p>`}
      ${!loading && rows.length === 0 && html`
        <div class="card"><p class="muted">Aucune inscription en attente.</p></div>`}

      ${rows.map((r) => {
        const blocked = r.consent_required && !r.parent_consent_at;
        return html`<div class="card" key=${r.id}>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap">
            <div>
              <p style="font-size:16px">${r.full_name}</p>
              <p class="muted">${r.age !== null ? `${r.age} ans` : "âge inconnu"} · demande du ${dateFr(r.created_at)}</p>
            </div>
            <button class="ghost tiny" onClick=${() => onOpen(r.id)}>Ouvrir la fiche</button>
          </div>

          <div class="row" style="margin-top:var(--s3)">
            <div><p style="font-size:14px">Adhésion vérifiée</p>
              <p class="muted">${r.member_since ? `Enregistrée le ${dateFr(r.member_since)}` : "Non enregistrée"}</p></div>
            ${!r.member_since && html`<button class="ghost tiny"
              onClick=${() => mark(r.id, { member_since: new Date().toISOString().slice(0,10) }, "details")}>
              Marquer adhérent</button>`}
          </div>

          ${r.consent_required && html`<div class="row">
            <div style="min-width:0">
              <p style="font-size:14px">Formulaire parental signé</p>
              <p class="muted">Obligatoire — moins de 15 ans. ${r.parent_name || ""} ${r.parent_email || ""}</p>
              ${r.consent_file
                ? html`<button class="plain" style="margin-top:var(--s1)"
                    onClick=${() => openFile(r.consent_file)}>📎 ${fileName(r.consent_file)}</button>`
                : html`<p class="muted" style="color:var(--alert);margin-top:var(--s1)">
                    Aucun document déposé par la famille.</p>`}
            </div>
            <div style="display:flex;gap:var(--s2);align-items:center;flex-shrink:0">
              ${!r.parent_consent_at
                ? html`<button class="ghost tiny" disabled=${!r.consent_file}
                    onClick=${() => mark(r.id, { parent_consent_at: new Date().toISOString() }, "details")}>
                    Valider l'accord</button>`
                : html`<span class="pill live">Validé le ${dateFr(r.parent_consent_at)}</span>`}
            </div>
          </div>`}

          <div style="margin-top:var(--s4);display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap">
            <button class="ok" disabled=${blocked}
              onClick=${() => mark(r.id, { status: "active" }, "profiles")}>Ouvrir le compte</button>
            <button class="ghost" onClick=${() => mark(r.id, { status: "suspended" }, "profiles")}>Refuser</button>
            ${blocked && html`<span class="muted">
              L'accord parental doit être enregistré avant l'ouverture du compte.</span>`}
          </div>
        </div>`;
      })}

      <${Signalements} team=${team || []} />
    </div>`;
}

/* --- Traitement des signalements par le bureau ------------------- */
const R_STATUS = { nouveau:"Nouveau", en_cours:"En cours", resolu:"Résolu", rejete:"Écarté" };
const R_KIND   = { bug:"Anomalie", amelioration:"Amélioration", forum:"Forum" };

function Signalements({ team }) {
  const [rows, setRows] = useState([]);
  const [filter, setFilter] = useState("ouverts");
  const [err, setErr] = useState("");

  useEffect(() => { load(); }, []);

  async function load() {
    const { data, error } = await db.from("reports_view")
      .select("*").order("created_at", { ascending:false });
    if (error) setErr(error.message); else setRows(data || []);
  }

  async function patch(id, p) {
    const { error } = await db.from("reports").update(p).eq("id", id);
    if (error) setErr(error.message); else await load();
  }

  const shown = filter === "ouverts"
    ? rows.filter((r) => ["nouveau","en_cours"].includes(r.status))
    : rows;
  const open = rows.filter((r) => ["nouveau","en_cours"].includes(r.status)).length;

  return html`
    <div style="margin-top:var(--s6);border-top:1px solid var(--line);padding-top:var(--s5)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)">
        <div>
          <h2 style="font-size:22px">Correctifs et améliorations</h2>
          <p class="muted">${open} en attente de traitement</p>
        </div>
        <div class="tags">
          ${[["ouverts","À traiter"],["tous","Tout l'historique"]].map(([k,l]) =>
            html`<span key=${k} class=${"tag" + (filter === k ? " on" : "")}
              onClick=${() => setFilter(k)}>${l}</span>`)}
        </div>
      </div>
      ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}
      ${shown.length === 0 && html`<div class="card"><p class="muted">
        Rien à traiter. Le bouton « Un souci, une idée ? » du tableau de bord alimente cette liste.</p></div>`}

      ${shown.map((r) => html`<div class="card" key=${r.id}>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap">
          <div style="min-width:0;flex:1">
            <span class="pill">${R_KIND[r.kind]}</span>
            ${r.priority === "haute" && html` <span class="pill off">prioritaire</span>`}
            <p style="font-size:16px;margin-top:var(--s2)">${r.title}</p>
            <p class="muted">${r.author_name || "Anonyme"} · ${since(r.created_at)}
              ${r.page ? ` · depuis ${r.page}` : ""}</p>
            ${r.body && html`<p class="muted" style="margin-top:var(--s2);white-space:pre-wrap">${r.body}</p>`}
          </div>
          <span class=${"pill " + (r.status === "resolu" ? "live" : r.status === "rejete" ? "off" : "wait")}>
            ${R_STATUS[r.status]}</span>
        </div>

        <div class="grid2" style="margin-top:var(--s4)">
          <div class="field" style="margin:0"><label>Confier à</label>
            <select value=${r.assigned_to || ""}
              onChange=${(e) => patch(r.id, { assigned_to: e.target.value || null,
                                              status: e.target.value ? "en_cours" : r.status })}>
              <option value="">Personne</option>
              ${team.map((t) => html`<option key=${t.id} value=${t.id}>${t.full_name}</option>`)}
            </select></div>
          <div class="field" style="margin:0"><label>Priorité</label>
            <select value=${r.priority} onChange=${(e) => patch(r.id, { priority: e.target.value })}>
              <option value="basse">Basse</option>
              <option value="normale">Normale</option>
              <option value="haute">Haute</option>
            </select></div>
        </div>

        <div style="display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-top:var(--s3)">
          ${r.status !== "resolu" && html`<button class="ok tiny"
            onClick=${() => patch(r.id, { status:"resolu",
              resolution: prompt("Un mot sur ce qui a été fait ?") || "Traité" })}>
            Marquer résolu</button>`}
          ${r.status !== "rejete" && html`<button class="ghost tiny"
            onClick=${() => patch(r.id, { status:"rejete",
              resolution: prompt("Pourquoi écarter ce signalement ?") || "Écarté" })}>
            Écarter</button>`}
          ${["resolu","rejete"].includes(r.status) && html`<button class="ghost tiny"
            onClick=${() => patch(r.id, { status:"en_cours" })}>Rouvrir</button>`}
          ${r.assignee_name && html`<span class="muted">confié à ${r.assignee_name}</span>`}
        </div>
        ${r.resolution && html`<p class="muted" style="margin-top:var(--s2);font-style:italic">${r.resolution}</p>`}
      </div>`)}
    </div>`;
}

/* ==================================================================
   10bis. CONTENU DE LA VITRINE
   ================================================================== */
const SECTIONS = [
  ["accueil", "Page d'accueil"], ["association", "L'association"], ["equipe", "L'équipe"],
  ["chiffres", "Nos chiffres"], ["adherer", "Nous rejoindre"], ["contact", "Contact"],
  ["legal", "Identité et documents légaux"],
];

function ContenuVitrine() {
  const [rows, setRows] = useState([]);
  const [draft, setDraft] = useState({});
  const [sec, setSec] = useState("accueil");
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");

  useEffect(() => { load(); }, []);

  async function load() {
    const { data, error } = await db.from("site_content").select("*").order("position");
    if (error) setErr(error.message);
    else { setRows(data || []); setDraft(Object.fromEntries((data || []).map((r) => [r.key, r.value || ""]))); }
  }

  async function save(key) {
    setMsg(""); setErr("");
    const { error } = await db.from("site_content").update({ value: draft[key] }).eq("key", key);
    if (error) setErr(error.message); else { setMsg("Enregistré."); setTimeout(() => setMsg(""), 2000); }
  }

  async function saveAll() {
    setMsg(""); setErr("");
    for (const r of rows.filter((x) => x.section === sec)) {
      if ((r.value || "") !== (draft[r.key] || "")) {
        const { error } = await db.from("site_content").update({ value: draft[r.key] }).eq("key", r.key);
        if (error) { setErr(error.message); return; }
      }
    }
    await load(); setMsg("Section enregistrée."); setTimeout(() => setMsg(""), 2500);
  }

  const champs = rows.filter((r) => r.section === sec);

  return html`
    <div>
      <h1 style="font-size:26px">Contenu du site public</h1>
      <p class="muted" style="margin-bottom:var(--s4)">
        Ce que voient les visiteurs non connectés. Modifiable ici, sans toucher au code.</p>
      ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}
      ${msg && html`<p class="notice" style="margin-bottom:var(--s3)">${msg}</p>`}

      <div class="tags" style="margin-bottom:var(--s4)">
        ${SECTIONS.map(([k, l]) => html`<span key=${k} class=${"tag" + (sec === k ? " on" : "")}
          onClick=${() => setSec(k)}>${l}</span>`)}
      </div>

      ${sec === "legal" && html`<p class="warn" style="margin-bottom:var(--s4)">
        Ces quatre premiers champs identifient juridiquement l'association et alimentent
        les mentions légales, la politique de confidentialité et le formulaire parental.
        Tant qu'ils sont vides, tu ne peux pas légalement inscrire un mineur.</p>`}

      <div class="card">
        ${champs.map((r) => html`<div class="field" key=${r.key}>
          <label>${r.label}</label>
          ${r.kind === "longtext"
            ? html`<textarea style="min-height:${r.section === "legal" ? "220px" : "90px"}"
                value=${draft[r.key] || ""}
                onInput=${(e) => setDraft({ ...draft, [r.key]: e.target.value })}></textarea>`
            : html`<input value=${draft[r.key] || ""}
                onInput=${(e) => setDraft({ ...draft, [r.key]: e.target.value })} />`}
        </div>`)}
        <button onClick=${saveAll}>Enregistrer cette section</button>
      </div>
    </div>`;
}

/* ==================================================================
   11. BACK-OFFICE DES COURS
   ================================================================== */
const EMPTY_LESSON = { title:"", type:"video", content_url:"", body:"", duration_min:"", xp:50 };

function Gestion({ courses, reload }) {
  const [sel, setSel] = useState(courses[0]?.id || null);
  const [err, setErr] = useState("");
  const [newCourse, setNew] = useState(null);
  const [draft, setDraft] = useState(null);
  const [editing, setEdit] = useState(null);
  const course = courses.find((c) => c.id === sel) || null;

  async function run(promise, done) {
    const { error } = await promise;
    if (error) setErr(error.message); else { setErr(""); if (done) done(); await reload(); }
  }

  async function saveCourse(e) {
    e.preventDefault();
    const pos = courses.length ? Math.max(...courses.map((c)=>c.position)) + 1 : 1;
    await run(db.from("courses").insert({
      title:newCourse.title.trim(), discipline:newCourse.discipline.trim() || null,
      description:newCourse.description.trim() || null, published:false, position:pos,
    }), () => setNew(null));
  }

  async function saveLesson(e) {
    e.preventDefault();
    const pos = course.lessons.length ? Math.max(...course.lessons.map((l)=>l.position)) + 1 : 1;
    const payload = {
      course_id:course.id, title:draft.title.trim(), type:draft.type,
      content_url:draft.content_url.trim() || null, body:draft.body.trim() || null,
      duration_min:draft.duration_min ? Number(draft.duration_min) : null,
      xp:Number(draft.xp) || 50,
    };
    if (editing) await run(db.from("lessons").update(payload).eq("id", editing), () => { setDraft(null); setEdit(null); });
    else await run(db.from("lessons").insert({ ...payload, position:pos }), () => setDraft(null));
  }

  async function move(lesson, dir) {
    const list = course.lessons;
    const i = list.findIndex((l) => l.id === lesson.id), j = i + dir;
    if (j < 0 || j >= list.length) return;
    await db.from("lessons").update({ position:list[j].position }).eq("id", list[i].id);
    await db.from("lessons").update({ position:list[i].position }).eq("id", list[j].id);
    await reload();
  }

  return html`
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)">
        <div><h1 style="font-size:26px">Gestion des cours</h1>
          <p class="muted">Crée tes cours, ajoute des leçons, publie quand tu es prêt.</p></div>
        <button onClick=${() => setNew(newCourse ? null : { title:"", discipline:"", description:"" })}>
          ${newCourse ? "Annuler" : "Nouveau cours"}</button>
      </div>
      ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}

      ${newCourse && html`<form class="card" onSubmit=${saveCourse} style="margin-bottom:var(--s4)">
        <div class="field"><label>Titre</label>
          <input value=${newCourse.title} onInput=${(e)=>setNew({...newCourse,title:e.target.value})} /></div>
        <div class="field"><label>Discipline</label>
          <input value=${newCourse.discipline} placeholder="Questions contemporaines, Histoire…"
            onInput=${(e)=>setNew({...newCourse,discipline:e.target.value})} /></div>
        <div class="field"><label>Description</label>
          <textarea value=${newCourse.description}
            onInput=${(e)=>setNew({...newCourse,description:e.target.value})}></textarea></div>
        <button disabled=${newCourse.title.trim().length < 3}>Créer le cours</button></form>`}

      <div class="split3">
        <div class="card" style="padding:var(--s2);align-self:start">
          ${courses.length === 0 && html`<p class="muted" style="padding:var(--s2)">Aucun cours.</p>`}
          ${courses.map((c) => html`<button key=${c.id} class=${"rowbtn" + (c.id===sel?" on":"")}
            onClick=${() => { setSel(c.id); setDraft(null); setEdit(null); }}>
            <span style="display:block;font-size:14px">${c.title}</span>
            <span class=${"pill" + (c.published?" live":"")}>${c.published?"Publié":"Brouillon"}</span></button>`)}
        </div>

        ${!course ? html`<div class="card"><p class="muted">Sélectionne ou crée un cours.</p></div>` : html`
          <div>
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap">
                <div><p class="eyebrow">${course.discipline || "Sans discipline"}</p>
                  <h2 style="font-size:22px;margin-top:var(--s1)">${course.title}</h2></div>
                <div style="display:flex;gap:var(--s2);align-items:center">
                  <button class="ghost" onClick=${() => run(db.from("courses").update({published:!course.published}).eq("id",course.id))}>
                    ${course.published ? "Dépublier" : "Publier"}</button>
                  <button class="danger" onClick=${() => { if (confirm("Supprimer ce cours et toutes ses leçons ?"))
                    run(db.from("courses").delete().eq("id",course.id), () => setSel(null)); }}>Supprimer</button>
                </div>
              </div>
              ${course.description && html`<p class="muted" style="margin-top:var(--s3)">${course.description}</p>`}
            </div>

            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-bottom:var(--s3)">
                <p class="eyebrow">${course.lessons.length} leçons</p>
                <button class="ghost tiny" onClick=${() => { setDraft(draft ? null : {...EMPTY_LESSON}); setEdit(null); }}>
                  ${draft && !editing ? "Annuler" : "Ajouter une leçon"}</button>
              </div>
              ${course.lessons.map((l, i) => html`<div class="row" key=${l.id}>
                <div style="flex:1;min-width:0">
                  <span style="font-size:14px">${i+1}. ${l.title}</span>
                  <span class="muted" style="display:block">${TYPES[l.type]||l.type} · ${l.xp} XP${l.content_url?" · contenu lié":" · sans contenu"}</span>
                </div>
                <div style="display:flex;gap:var(--s2);align-items:center;flex-shrink:0">
                  <button class="ghost tiny" disabled=${i===0} onClick=${() => move(l,-1)}>↑</button>
                  <button class="ghost tiny" disabled=${i===course.lessons.length-1} onClick=${() => move(l,1)}>↓</button>
                  <button class="ghost tiny" onClick=${() => { setEdit(l.id); setDraft({
                    title:l.title, type:l.type, content_url:l.content_url||"", body:l.body||"",
                    duration_min:l.duration_min||"", xp:l.xp }); }}>Modifier</button>
                  <button class="danger" onClick=${() => { if (confirm("Supprimer cette leçon ?"))
                    run(db.from("lessons").delete().eq("id",l.id)); }}>✕</button>
                </div>
              </div>`)}

              ${draft && html`<form onSubmit=${saveLesson} style="border-top:1px solid var(--line);margin-top:var(--s3);padding-top:var(--s4)">
                <p class="eyebrow" style="margin-bottom:var(--s3)">${editing ? "Modifier la leçon" : "Nouvelle leçon"}</p>
                <div class="field"><label>Titre</label>
                  <input value=${draft.title} onInput=${(e)=>setDraft({...draft,title:e.target.value})} /></div>
                <div class="grid2">
                  <div class="field"><label>Type</label>
                    <select value=${draft.type} onChange=${(e)=>setDraft({...draft,type:e.target.value})}>
                      ${Object.entries(TYPES).map(([k,v]) => html`<option key=${k} value=${k}>${v}</option>`)}
                    </select></div>
                  <div class="field"><label>Durée (minutes)</label>
                    <input type="number" value=${draft.duration_min}
                      onInput=${(e)=>setDraft({...draft,duration_min:e.target.value})} /></div>
                </div>
                <div class="field"><label>Lien du contenu — YouTube non répertorié, PDF, audio</label>
                  <input value=${draft.content_url} placeholder="https://youtu.be/…"
                    onInput=${(e)=>setDraft({...draft,content_url:e.target.value})} /></div>
                <div class="field"><label>Texte de la leçon (facultatif)</label>
                  <textarea value=${draft.body} onInput=${(e)=>setDraft({...draft,body:e.target.value})}></textarea></div>
                <div class="field" style="max-width:160px"><label>XP accordés</label>
                  <input type="number" value=${draft.xp} onInput=${(e)=>setDraft({...draft,xp:e.target.value})} /></div>
                <div style="display:flex;gap:var(--s2)">
                  <button disabled=${draft.title.trim().length < 3}>${editing ? "Enregistrer" : "Ajouter"}</button>
                  <button type="button" class="ghost" onClick=${() => { setDraft(null); setEdit(null); }}>Annuler</button>
                </div>
              </form>`}
            </div>
          </div>`}
      </div>
    </div>`;
}

/* ==================================================================
   12. APPLICATION
   ================================================================== */
function App() {
  const [screen, setScreen] = useState("vitrine");
  const [session, setSession] = useState(null);
  const [me, setMe] = useState(null);
  const [myDetails, setMyDetails] = useState(null);
  const [courses, setCourses] = useState([]);
  const [done, setDone] = useState(new Set());
  const [myXp, setMyXp] = useState({ xp:0, lessons_done:0, assignments_done:0 });
  const [streak, setStreak] = useState(0);
  const [fresh, setFresh] = useState(0);
  const [rows, setRows] = useState([]);
  const [tutors, setTutors] = useState([]);
  const [tags, setTags] = useState([]);
  const [viewAs, setViewAs] = useState(null);
  const [myGrade, setMyGrade] = useState(null);
  const [report, setReport] = useState(false);
  const [pendingCount, setPendingCount] = useState(0);
  const [view, setView] = useState({ page:"cours" });
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [fail, setFail] = useState("");

  useEffect(() => {
    db.auth.getSession().then(({ data }) => { setSession(data.session); setLoading(false); });
    const { data: sub } = db.auth.onAuthStateChange((_e, s) => {
      setSession(s);
      if (!s) { setMe(null); setView({ page:"cours" }); setScreen("vitrine"); }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => { if (session) load(); }, [session]);

  async function load() {
    setFail("");
    try {
      const uid = session.user.id;

      const { data: prof, error: e1 } = await db.from("profiles")
        .select("id, full_name, role, status, tutor_id").eq("id", uid).single();
      if (e1) throw e1;
      setMe(prof);

      const { data: mine } = await db.from("student_details").select("*").eq("user_id", uid).maybeSingle();
      setMyDetails(mine || {});

      const { data: tg } = await db.from("subject_tags").select("*").order("position");
      setTags(tg || []);

      if (prof.role !== "eleve") {
        const { data: g } = await db.rpc("my_grade");
        setMyGrade(Array.isArray(g) ? g[0] : g);
      }

      if (prof.role === "eleve" && prof.status !== "active") { setLoading(false); return; }

      const { data: cs, error: e2 } = await db.from("courses")
        .select("id, title, discipline, description, published, position, lessons(id, title, type, xp, duration_min, position, content_url, body)");
      if (e2) throw e2;
      setCourses((cs || []).sort((a,b) => a.position-b.position)
        .map((c) => ({ ...c, lessons:(c.lessons||[]).sort((a,b) => a.position-b.position) })));

      const { data: comp } = await db.from("lesson_completions").select("lesson_id").eq("user_id", uid);
      setDone(new Set((comp || []).map((c) => c.lesson_id)));

      // Le barème vit dans la base : on lit le résultat, on ne le recalcule pas.
      const { data: myx } = await db.from("user_xp")
        .select("xp, lessons_done, assignments_done").eq("user_id", uid).maybeSingle();
      setMyXp(myx || { xp:0, lessons_done:0, assignments_done:0 });

      // Présence du jour, puis attribution des badges mérités.
      await db.rpc("touch_today");
      const { data: gained } = await db.rpc("refresh_my_badges");
      setFresh(gained || 0);
      const { data: st } = await db.rpc("my_streak");
      setStreak(st || 0);

      if (prof.role !== "eleve") {
        let q = db.from("profiles").select("id, full_name, role, status, tutor_id").order("full_name");
        if (prof.role === "encadrant") q = q.eq("tutor_id", uid);
        const { data: people } = await q;

        const { data: scores } = await db.from("user_xp").select("user_id, xp, lessons_done");
        const { data: unread } = await db.from("messages").select("student_id, sender_id, read_at").is("read_at", null);
        const byId = Object.fromEntries((scores || []).map((s) => [s.user_id, s]));

        setRows((people || []).filter((p) => p.id !== uid && p.role === "eleve").map((p) => ({
          ...p,
          xp: byId[p.id]?.xp ?? 0,
          lessons_done: byId[p.id]?.lessons_done ?? 0,
          unread: (unread || []).filter((m) => m.student_id === p.id && m.sender_id !== uid).length,
        })));

        if (prof.role === "admin") {
          const { data: staff } = await db.from("profiles")
            .select("id, full_name").in("role", ["encadrant", "admin"]).order("full_name");
          setTutors(staff || []);
          const { count } = await db.from("profiles")
            .select("id", { count:"exact", head:true }).eq("role","eleve").eq("status","pending");
          setPendingCount(count || 0);
        }
      }
    } catch (e) {
      setFail(e.message || "Impossible de charger les données.");
    }
    setLoading(false);
  }

  async function toggle(lessonId, isDone) {
    setBusy(true);
    const uid = session.user.id, next = new Set(done);
    if (isDone) {
      const { error } = await db.from("lesson_completions").delete().eq("user_id",uid).eq("lesson_id",lessonId);
      if (!error) next.delete(lessonId);
    } else {
      const { error } = await db.from("lesson_completions").insert({ user_id:uid, lesson_id:lessonId });
      if (!error) next.add(lessonId);
    }
    setDone(next); setBusy(false);
  }

  async function setRole(id, role) {
    const { error } = await db.from("profiles").update({ role }).eq("id", id);
    if (error) { setFail(error.message); return; }
    await load();
  }

  if (loading && !session) return html`<div class="center-page"><p class="muted">Chargement…</p></div>`;
  if (!session) return screen === "connexion"
    ? html`<${Connexion} onBack=${() => setScreen("vitrine")} />`
    : html`<${Vitrine} onEnter=${() => setScreen("connexion")} />`;
  if (!me) return html`<div class="center-page"><p class="muted">Chargement…</p></div>`;

  if (me.role === "eleve" && me.status !== "active")
    return html`<${EnAttente} me=${me} details=${myDetails} reload=${load} />`;

  // Rôle affiché : purement cosmétique. Les droits restent ceux du vrai
  // rôle, appliqués par la base. Une bascule peut cacher, jamais ouvrir.
  const shown = viewAs || me.role;
  const staff = shown !== "eleve";
  const visible = staff ? courses : courses.filter((c) => c.published);
  const xp = myXp.xp || 0;
  const totalLessons = visible.reduce((n,c) => n + c.lessons.length, 0);
  const unreadTotal = rows.reduce((n,r) => n + (r.unread||0), 0);

  const tabs = shown === "admin"
    ? [["bord","Tableau de bord"], ["cours","Cours"], ["gestion","Gestion"], ["devoirs","Devoirs"],
       ["eleves","Élèves"], ["equipe","Équipe"], ["vitrine","Vitrine"],
       ["validation", pendingCount ? `Validation (${pendingCount})` : "Validation"],
       ["forum","Forum"], ["messages", unreadTotal ? `Messages (${unreadTotal})` : "Messages"]]
    : shown === "encadrant"
      ? [["bord","Tableau de bord"], ["rappel","Rappels"], ["cours","Cours"], ["devoirs","Devoirs"],
         ["eleves","Mes élèves"], ["forum","Forum"],
         ["messages", unreadTotal ? `Messages (${unreadTotal})` : "Messages"]]
      : [["cours","Mes cours"], ["devoirs","Devoirs"], ["badges","Badges"],
         ["forum","Forum"], ["messages","Mon encadrant"]];

  const lower = me.role === "admin" ? ["encadrant", "eleve"] : me.role === "encadrant" ? ["eleve"] : [];
  const okTab = tabs.some(([k]) => k === view.page) || ["compte","profil"].includes(view.page);

  return html`
    <div>
      ${viewAs && html`<div class="viewas"><div class="wrap">
        <span>Affichage en vue ${ROLES[viewAs].toLowerCase()} — tes droits réels
          restent ceux du rôle ${ROLES[me.role].toLowerCase()}.</span>
        <button class="ghost tiny" onClick=${() => { setViewAs(null); setView({ page:"cours" }); }}>
          Revenir à ma vue</button>
      </div></div>`}

      <div class="topbar"><div class="wrap">
        <div style="display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap">
          <span class="brand">${ASSO.nom}</span>
          <div class="navlinks">
            ${tabs.map(([k,label]) => html`<button key=${k} class=${view.page===k?"on":""}
              onClick=${() => setView({ page:k })}>${label}</button>`)}
          </div>
        </div>
        <${MenuCompte} me=${me} grade=${myGrade} viewAs=${viewAs} lower=${lower}
          onView=${(r) => { setViewAs(r); setView({ page: r === "eleve" ? "cours" : "bord" }); }}
          onGo=${(p) => setView({ page:p })} />
      </div></div>

      <div class="wrap" style="padding-top:var(--s5);padding-bottom:var(--s6)">
        ${fail && html`<p class="error" style="margin-bottom:var(--s4)">${fail}</p>`}

        ${!okTab ? html`<${MesCours} me=${me} courses=${visible} done=${done} xp=${xp}
            streak=${streak} fresh=${fresh}
            onBadges=${() => { setFresh(0); setView({ page:"badges" }); }}
            onReport=${() => setReport(true)}
            onOpen=${(id) => setView({ page:"cours", id })} />`
        : view.page === "bord"
          ? (shown === "admin"
              ? html`<${BordAdmin} me=${me} onGo=${(p) => setView({ page:p })}
                       onReport=${() => setReport(true)} />`
              : html`<${BordEncadrant} me=${me} rows=${rows} onReport=${() => setReport(true)}
                       onOpen=${(id) => setView({ page:"eleves", student:id })} />`)
        : view.page === "vitrine" ? html`<${ContenuVitrine} />`
        : view.page === "compte" ? html`<${MonCompte} me=${me} reload=${load} />`
        : view.page === "rappel" ? html`<${Rappel} me=${me} rows=${rows}
            onOpen=${(id) => setView({ page:"eleves", student:id })} />`
        : view.page === "profil" ? html`<${Profil} me=${me} reload=${load} />`
        : view.page === "equipe" ? html`<${Equipe} tags=${tags} onSetRole=${setRole} />`
        : view.page === "gestion" ? html`<${Gestion} courses=${courses} reload=${load} />`
        : view.page === "devoirs"
          ? (staff
              ? html`<${DevoirsAdmin} me=${me} courses=${courses} tags=${tags} reload=${load} />`
              : html`<${Devoirs} me=${me} reload=${load} />`)
        : view.page === "validation" ? html`<${Validation} reload=${load} team=${tutors}
            onOpen=${(id) => setView({ page:"eleves", student:id })} />`
        : view.page === "eleves"
          ? (view.student
              ? html`<${Fiche} me=${me} studentId=${view.student} courses=${courses} tutors=${tutors}
                       reload=${load} onBack=${() => setView({ page:"eleves" })} />`
              : html`<${Eleves} me=${me} rows=${rows} totalLessons=${totalLessons}
                       onOpen=${(id) => setView({ page:"eleves", student:id })}
                       title=${me.role === "admin" ? "Tous les élèves" : "Mes élèves"}
                       subtitle=${me.role === "admin"
                         ? `${rows.length} comptes élèves`
                         : `${rows.length} élèves te sont rattachés`} />`)
        : view.page === "badges" ? html`<${Badges} me=${me} />`
        : view.page === "forum" ? html`<${Forum} me=${me} />`
        : view.page === "messages" ? html`<${Messagerie} me=${me} students=${rows} tags=${tags} />`
        : view.id ? html`<${Cours} course=${visible.find((c)=>c.id===view.id)} done=${done} busy=${busy}
            readOnly=${staff} onToggle=${toggle} onBack=${() => setView({ page:"cours" })} />`
        : html`<${MesCours} me=${me} courses=${visible} done=${done} xp=${xp}
            streak=${streak} fresh=${fresh}
            onBadges=${() => { setFresh(0); setView({ page:"badges" }); }}
            onReport=${() => setReport(true)}
            onOpen=${(id) => setView({ page:"cours", id })} />`}
      </div>
      ${report && html`<${Signaler} me=${me} page=${view.page} onClose=${() => setReport(false)} />`}
    </div>`;
}

render(html`<${App} />`, document.getElementById("root"));
</script>
</body>
</html>
