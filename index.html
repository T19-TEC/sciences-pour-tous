<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sciences pour tous — Préparation au concours commun des IEP</title>
<meta name="description" content="Association préparant gratuitement les lycéens au concours commun des Instituts d'études politiques." />

<style>
:root {
  --ink:#0F172A; --ink-soft:#1E293B; --gray:#64748B; --gray-soft:#94A3B8;
  --paper:#F8FAFC; --white:#FFFFFF; --line:#E2E8F0;
  --xp:#B45309; --xp-bright:#F59E0B; --ok:#059669; --alert:#DC2626;
  --s1:4px; --s2:8px; --s3:12px; --s4:20px; --s5:32px; --s6:48px;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.2}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:6px;padding:9px var(--s4);background:var(--ink);color:var(--white)}
button:hover:not(:disabled){background:var(--ink-soft)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover:not(:disabled){background:var(--paper)}
button.plain{background:none;color:var(--gray);padding:0;font-size:14px}
button.plain:hover:not(:disabled){color:var(--ink);background:none}
button.danger{background:none;color:var(--alert);padding:0;font-size:13px}
button.danger:hover:not(:disabled){background:none;text-decoration:underline}
button.tiny{padding:4px var(--s2);font-size:12px}
button.ok{background:var(--ok)}
button.ok:hover:not(:disabled){background:#047857}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:9px var(--s3);border:1px solid var(--line);border-radius:6px;background:var(--white);color:var(--ink)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--gray);margin-bottom:var(--s1)}
.field{margin-bottom:var(--s3)}
.wrap{max-width:960px;margin:0 auto;padding:0 var(--s4)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s4)}
.card+.card{margin-top:var(--s3)}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-soft)}
.muted{color:var(--gray);font-size:13px}
.error{color:var(--alert);font-size:13px;background:#FEF2F2;border:1px solid #FECACA;border-radius:6px;padding:var(--s2) var(--s3);margin-top:var(--s3)}
.notice{color:#065F46;font-size:13px;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:6px;padding:var(--s2) var(--s3);margin-top:var(--s3)}
.warn{color:#78350F;font-size:13px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:6px;padding:var(--s2) var(--s3)}
.todo{color:var(--gray);font-size:12px;background:var(--paper);border:1px dashed var(--line);border-radius:6px;padding:var(--s2) var(--s3)}
.pill{display:inline-block;font-size:11px;padding:2px var(--s2);border-radius:999px;background:var(--paper);color:var(--gray);border:1px solid var(--line)}
.pill.live{background:#ECFDF5;color:#065F46;border-color:#A7F3D0}
.pill.wait{background:#FFFBEB;color:#78350F;border-color:#FDE68A}
.pill.off{background:#FEF2F2;color:#991B1B;border-color:#FECACA}
.pill.unread{background:var(--xp-bright);color:#422006;border-color:var(--xp-bright)}
.topbar{background:var(--ink);color:var(--white)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:var(--s3) var(--s4);flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:18px;white-space:nowrap}
.navlinks{display:flex;gap:var(--s1);flex-wrap:wrap}
.navlinks button{background:none;color:#CBD5E1;padding:5px var(--s3);font-size:14px}
.navlinks button:hover:not(:disabled){color:var(--white);background:var(--ink-soft)}
.navlinks button.on{background:#334155;color:var(--white)}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track>i{display:block;height:100%;background:var(--xp-bright)}
.track.dark>i{background:var(--ink)}
.grid2{display:grid;gap:var(--s3);grid-template-columns:1fr 1fr}
.split{display:grid;gap:var(--s4);grid-template-columns:1fr 280px}
.split3{display:grid;gap:var(--s4);grid-template-columns:250px 1fr}
@media(max-width:780px){.grid2,.split,.split3{grid-template-columns:1fr}}
.lesson{display:flex;align-items:flex-start;gap:var(--s2);width:100%;text-align:left;background:none;color:var(--ink);padding:var(--s2);border-radius:6px;font-size:14px}
.lesson:hover:not(:disabled){background:var(--paper)}
.lesson.on{background:var(--paper);font-weight:600}
.lesson.done span{color:var(--gray-soft);text-decoration:line-through}
.lesson:disabled{color:var(--gray-soft)}
.dot{flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--gray-soft);margin-top:3px}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.here{border-color:var(--ink);border-width:5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.rowbtn{display:block;width:100%;text-align:left;background:none;color:var(--ink);padding:var(--s3);border-radius:6px}
.rowbtn:hover:not(:disabled){background:var(--paper)}
.rowbtn.on{background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:400;color:var(--gray);font-size:13px;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line)}
td{padding:var(--s3);border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.bubble{max-width:78%;padding:var(--s2) var(--s3);border-radius:var(--radius);background:var(--paper);font-size:14px;white-space:pre-wrap}
.bubble.mine{background:var(--ink);color:var(--white)}
.msgline{display:flex;flex-direction:column;gap:var(--s1);margin-bottom:var(--s3)}
.msgline.mine{align-items:flex-end}
.center-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--s5) var(--s4)}
.dl{display:grid;grid-template-columns:130px 1fr;gap:var(--s2) var(--s3);font-size:14px}
.dl dt{color:var(--gray);font-size:13px}
.check{display:flex;gap:var(--s2);align-items:flex-start;font-size:13px;color:var(--ink);line-height:1.45}
.check input{width:auto;margin-top:3px;flex:0 0 auto}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.badge{border:1px solid var(--line);border-radius:var(--radius);padding:var(--s3);background:var(--white);text-align:center}
.badge.locked{background:var(--paper);border-style:dashed}
.medal{width:46px;height:46px;border-radius:50%;margin:0 auto var(--s2);display:flex;align-items:center;
  justify-content:center;font-family:var(--serif);font-size:16px;border:2px solid}
.medal.bronze{border-color:#B45309;color:#B45309;background:#FFFBEB}
.medal.argent{border-color:#64748B;color:#475569;background:#F8FAFC}
.medal.or{border-color:#F59E0B;color:#92400E;background:#FEF3C7}
.badge.locked .medal{border-color:var(--line);color:var(--gray-soft);background:var(--white)}
.badge.locked .bname{color:var(--gray)}
.bname{font-size:14px;margin-bottom:var(--s1)}
.flame{display:inline-flex;align-items:baseline;gap:var(--s2);padding:var(--s2) var(--s3);
  border-radius:var(--radius);background:#FFFBEB;border:1px solid #FDE68A;color:#78350F;font-size:13px}
.avatar{border-radius:50%;object-fit:cover;background:var(--paper);flex:0 0 auto;
  border:1px solid var(--line);display:block}
.avatar-fb{border-radius:50%;background:var(--ink);color:var(--white);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif)}
.tag{display:inline-block;font-size:12px;padding:3px var(--s3);border-radius:999px;
  border:1px solid var(--line);background:var(--white);color:var(--gray);cursor:pointer}
.tag.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:var(--s2)}
.role{display:inline-block;font-size:11px;padding:1px var(--s2);border-radius:999px;
  border:1px solid var(--line);color:var(--gray);background:var(--paper);margin-left:var(--s2)}
.role.enc{border-color:#A7F3D0;background:#ECFDF5;color:#065F46}
.role.adm{border-color:#FDE68A;background:#FFFBEB;color:#78350F}
.viewas{background:#FFFBEB;border-bottom:1px solid #FDE68A;color:#78350F;font-size:13px}
.viewas .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:var(--s2) var(--s4);flex-wrap:wrap}
</style>
</head>

<body>
<div id="root"></div>

<script type="module">
/* ==================================================================
   1. RÉGLAGES DE L'ASSOCIATION
   Les champs vides sont volontaires : remplis-les quand tu auras
   ouvert HelloAsso et rédigé tes mentions légales. L'interface
   s'adapte toute seule et n'affiche rien tant qu'ils sont vides.
   ================================================================== */
const ASSO = {
  nom:            "Sciences pour tous",
  adhesionUrl:    "",   // ← lien HelloAsso vers la campagne d'adhésion
  cotisation:     "",   // ← exemple : "5 €"
  contactEmail:   "",   // ← adresse de contact de l'association
  mentionsUrl:    "",   // ← lien vers les mentions légales
  confidentUrl:   "",   // ← lien vers la politique de confidentialité
  consentementUrl:"",   // ← lien vers le formulaire de consentement parental
};

const SUPABASE_URL = "https://psdgksngudmutxgfgdsa.supabase.co";
const SUPABASE_KEY = "sb_publishable_djEYr000RbrX5N2GiC0RQg_jjHzfEpf";

import { h, render } from "https://esm.sh/preact@10.22.0";
import { useState, useEffect, useRef } from "https://esm.sh/preact@10.22.0/hooks";
import htm from "https://esm.sh/htm@3.1.1";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.0";

const html = htm.bind(h);
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ==================================================================
   2. OUTILS
   ================================================================== */
const XP_PER_LEVEL = 300;
const levelOf = (xp) => Math.floor(xp / XP_PER_LEVEL) + 1;
const TYPES = { video:"Vidéo", audio:"Audio", pdf:"Document", quiz:"Quiz", texte:"Lecture" };
const ROLES = { eleve:"Élève", encadrant:"Encadrant", admin:"Bureau" };

function ageFrom(dateStr) {
  if (!dateStr) return null;
  const b = new Date(dateStr);
  if (isNaN(b)) return null;
  const now = new Date();
  let a = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) a--;
  return a;
}

function embedUrl(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

function since(iso) {
  if (!iso) return "";
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s/60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s/3600)} h`;
  if (s < 604800) return `il y a ${Math.floor(s/86400)} j`;
  return new Date(iso).toLocaleDateString("fr-FR");
}

const dateFr = (d) => (d ? new Date(d).toLocaleDateString("fr-FR") : "—");
const dateTimeFr = (d) => (d ? new Date(d).toLocaleString("fr-FR", { dateStyle:"short", timeStyle:"short" }) : "—");

// Échéance : reste-t-il du temps, et combien ?
function deadline(due) {
  if (!due) return { none:true, label:"Sans date limite" };
  const d = new Date(due), ms = d - Date.now();
  if (ms < 0) return { late:true, label:`Échéance dépassée le ${dateTimeFr(due)}` };
  const days = Math.ceil(ms / 86400000);
  return { late:false, soon: days <= 3,
    label: days <= 1 ? "À rendre aujourd'hui" : `À rendre dans ${days} jours` };
}

/* --- Stockage de fichiers ------------------------------------------
   Le bac est privé : aucun fichier n'a d'adresse publique. On demande
   un lien signé à chaque consultation, valable dix minutes.          */
async function uploadFile(folder, uid, file) {
  const safe = file.name.replace(/[^\w.\-]/g, "_");
  const path = `${folder}/${uid}/${Date.now()}-${safe}`;
  const { error } = await db.storage.from("documents").upload(path, file);
  return error ? { error: error.message } : { path };
}

async function openFile(path) {
  const { data, error } = await db.storage.from("documents").createSignedUrl(path, 600);
  if (error || !data?.signedUrl) return alert("Impossible d'ouvrir le fichier : " + (error?.message || "lien indisponible"));
  window.open(data.signedUrl, "_blank", "noopener");
}

const fileName = (p) => (p ? p.split("/").pop().replace(/^\d+-/, "") : "");

// Le bac des photos est public : l'adresse est directe, sans lien signé.
function avatarUrl(path) {
  if (!path) return null;
  const { data } = db.storage.from("avatars").getPublicUrl(path);
  return data?.publicUrl || null;
}

const initials = (name) =>
  (name || "?").split(/\s+/).slice(0, 2).map((w) => w[0] || "").join("").toUpperCase();

// Photo, ou monogramme de repli.
function Avatar({ name, path, size = 40 }) {
  const url = avatarUrl(path);
  const s = `width:${size}px;height:${size}px`;
  return url
    ? html`<img class="avatar" src=${url} alt=${name || ""} style=${s} />`
    : html`<div class="avatar-fb" style=${`${s};font-size:${Math.round(size / 2.6)}px`}>${initials(name)}</div>`;
}

// Pastille de rôle, affichée partout où un nom apparaît.
function Role({ role }) {
  if (role === "encadrant") return html`<span class="role enc">Encadrant</span>`;
  if (role === "admin")     return html`<span class="role adm">Bureau</span>`;
  return null;
}

const monthStart = (offset = 0) => {
  const d = new Date();
  d.setDate(1); d.setMonth(d.getMonth() + offset);
  return d.toISOString().slice(0, 10);
};
const monthLabel = (iso) =>
  new Date(iso).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

/* ==================================================================
   3. VITRINE PUBLIQUE
   ================================================================== */
function Vitrine({ onEnter }) {
  return html`
    <div>
      <div class="topbar"><div class="wrap">
        <span class="brand">${ASSO.nom}</span>
        <button onClick=${onEnter}>Accéder à mon espace</button>
      </div></div>

      <div class="wrap" style="padding:var(--s6) var(--s4);max-width:740px">
        <p class="eyebrow">Association loi 1901</p>
        <h1 style="font-size:38px;margin:var(--s2) 0 var(--s4)">
          Préparer le concours commun des IEP,<br/>sans payer une prépa privée.</h1>
        <p style="font-size:17px;color:var(--gray);margin-bottom:var(--s5)">
          Nous accompagnons les lycéens vers le concours commun des Instituts
          d'études politiques. Cours en ligne, suivi individuel par un encadrant
          bénévole, et une communauté d'élèves qui avancent ensemble.</p>
        <button onClick=${onEnter} style="font-size:15px;padding:12px var(--s5)">
          Rejoindre la préparation</button>
        ${ASSO.cotisation && html`<p class="muted" style="margin-top:var(--s3)">
          L'accès à la plateforme est réservé aux adhérents — cotisation ${ASSO.cotisation} par an.</p>`}
      </div>

      <div class="wrap" style="padding-bottom:var(--s6)"><div class="grid2">
        <div class="card">
          <h3 style="font-size:19px;margin-bottom:var(--s2)">Des cours structurés</h3>
          <p class="muted">Chaque thème est découpé en leçons courtes — vidéo, fiche,
            podcast, quiz — que tu suis à ton rythme, dans l'ordre.</p></div>
        <div class="card">
          <h3 style="font-size:19px;margin-bottom:var(--s2)">Un encadrant pour toi</h3>
          <p class="muted">Un bénévole suit ta progression, corrige tes dissertations
            et répond à tes questions tout au long de l'année.</p></div>
      </div></div>

      <div style="border-top:1px solid var(--line);padding:var(--s4) 0"><div class="wrap">
        <p class="muted">${ASSO.nom} — association à but non lucratif</p>
        <p class="muted" style="margin-top:var(--s2)">
          ${ASSO.mentionsUrl ? html`<a href=${ASSO.mentionsUrl}>Mentions légales</a> · ` : ""}
          ${ASSO.confidentUrl ? html`<a href=${ASSO.confidentUrl}>Politique de confidentialité</a>` : ""}
        </p>
      </div></div>
    </div>`;
}

/* ==================================================================
   4. CONNEXION ET INSCRIPTION
   ================================================================== */
function Connexion({ onBack }) {
  const [mode, setMode] = useState("login");
  const [f, setF] = useState({ name:"", mail:"", pass:"", birth:"", phone:"", pname:"", pmail:"" });
  const [okAdhesion, setOkAdhesion] = useState(false);
  const [okConsent, setOkConsent] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [done, setDone] = useState("");

  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const age = ageFrom(f.birth);
  const minor = age !== null && age < 15;

  async function submit(e) {
    e.preventDefault();
    setErr(""); setDone(""); setBusy(true);

    if (mode === "login") {
      const { error } = await db.auth.signInWithPassword({ email: f.mail, password: f.pass });
      if (error) setErr("Adresse e-mail ou mot de passe incorrect.");
      setBusy(false); return;
    }

    if (f.name.trim().length < 3)  { setErr("Indique ton prénom et ton nom."); setBusy(false); return; }
    if (age === null)              { setErr("Indique ta date de naissance."); setBusy(false); return; }
    if (age < 10 || age > 100)     { setErr("Cette date de naissance ne semble pas correcte."); setBusy(false); return; }
    if (f.pass.length < 8)         { setErr("Le mot de passe doit faire au moins 8 caractères."); setBusy(false); return; }
    if (!okAdhesion)               { setErr("Tu dois reconnaître la condition d'adhésion."); setBusy(false); return; }
    if (minor && (!f.pmail.trim() || !f.pname.trim())) {
      setErr("En dessous de 15 ans, les coordonnées d'un parent sont obligatoires."); setBusy(false); return; }
    if (minor && !okConsent) {
      setErr("En dessous de 15 ans, l'accord d'un parent est obligatoire."); setBusy(false); return; }

    const { data, error } = await db.auth.signUp({
      email: f.mail, password: f.pass,
      options: { data: {
        full_name: f.name.trim(), birthdate: f.birth,
        phone: f.phone.trim(), parent_name: f.pname.trim(), parent_email: f.pmail.trim(),
      }},
    });
    if (error) setErr(error.message);
    else setDone(data.session
      ? "Compte créé. Il doit maintenant être validé par l'association."
      : "Compte créé. Confirme ton adresse via l'e-mail reçu, puis reconnecte-toi. Ton compte sera ensuite validé par l'association.");
    setBusy(false);
  }

  return html`
    <div class="center-page" style="background:var(--ink)">
      <div style="width:100%;max-width:420px">
        <p style="font-family:var(--serif);font-size:28px;color:var(--white)">${ASSO.nom}</p>
        <p style="color:var(--gray-soft);font-size:14px;margin-bottom:var(--s5)">
          Préparation au concours commun des IEP</p>

        <form class="card" onSubmit=${submit}>
          ${mode === "signup" && html`
            <div class="field"><label>Prénom et nom</label>
              <input value=${f.name} onInput=${set("name")} autocomplete="name" /></div>
            <div class="field"><label>Date de naissance</label>
              <input type="date" value=${f.birth} onInput=${set("birth")} /></div>`}

          <div class="field"><label>Adresse e-mail</label>
            <input type="email" required value=${f.mail} onInput=${set("mail")} autocomplete="email" /></div>

          <div class="field"><label>Mot de passe</label>
            <input type="password" required value=${f.pass} onInput=${set("pass")}
              autocomplete=${mode === "login" ? "current-password" : "new-password"} /></div>

          ${mode === "signup" && html`
            <div class="field"><label>Téléphone (facultatif)</label>
              <input value=${f.phone} onInput=${set("phone")} autocomplete="tel" /></div>

            ${minor && html`
              <div class="warn" style="margin-bottom:var(--s3)">
                Tu as moins de 15 ans. La loi impose l'accord d'un de tes parents
                pour créer ton compte. Ses coordonnées sont donc obligatoires.
              </div>
              <div class="field"><label>Nom du parent ou responsable légal</label>
                <input value=${f.pname} onInput=${set("pname")} /></div>
              <div class="field"><label>Adresse e-mail du parent</label>
                <input type="email" value=${f.pmail} onInput=${set("pmail")} /></div>
              <label class="check" style="margin-bottom:var(--s3)">
                <input type="checkbox" checked=${okConsent} onChange=${(e)=>setOkConsent(e.target.checked)} />
                <span>Mon parent est informé de mon inscription et acceptera d'être
                  contacté par l'association pour donner son accord écrit.
                  ${ASSO.consentementUrl && html` <a href=${ASSO.consentementUrl}>Voir le formulaire</a>`}</span>
              </label>`}

            <label class="check" style="margin-bottom:var(--s3)">
              <input type="checkbox" checked=${okAdhesion} onChange=${(e)=>setOkAdhesion(e.target.checked)} />
              <span>Je comprends que l'accès à la plateforme est réservé aux adhérents
                de l'association, et que mon compte sera ouvert après vérification de mon adhésion.
                ${ASSO.adhesionUrl && html` <a href=${ASSO.adhesionUrl}>Adhérer maintenant</a>`}</span>
            </label>

            ${!ASSO.adhesionUrl && html`<p class="todo" style="margin-bottom:var(--s3)">
              Lien d'adhésion HelloAsso à renseigner dans les réglages du fichier.</p>`}`}

          ${err && html`<p class="error">${err}</p>`}
          ${done && html`<p class="notice">${done}</p>`}

          <button style="width:100%;margin-top:var(--s3)" disabled=${busy}>
            ${busy ? "Un instant…" : mode === "login" ? "Se connecter" : "Créer mon compte"}</button>

          <div style="text-align:center;margin-top:var(--s3)">
            <button type="button" class="plain" onClick=${() => {
              setMode(mode === "login" ? "signup" : "login"); setErr(""); setDone(""); }}>
              ${mode === "login" ? "Pas encore de compte ? En créer un" : "J'ai déjà un compte"}</button>

/* ==================================================================
   5. COMPTE EN ATTENTE DE VALIDATION
   ================================================================== */
function EnAttente({ me, details, reload }) {
  const age = ageFrom(details?.birthdate);
  const minor = age !== null && age < 15;
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function sendConsent(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { setErr("Le fichier ne doit pas dépasser 10 Mo."); return; }
    setBusy(true); setErr("");
    const res = await uploadFile("consent", me.id, file);
    if (res.error) setErr(res.error);
    else {
      const { error } = await db.from("student_details")
        .update({ consent_file: res.path }).eq("user_id", me.id);
      if (error) setErr(error.message); else await reload();
    }
    setBusy(false);
  }

  return html`
    <div class="center-page">
      <div style="width:100%;max-width:560px">
        <p class="eyebrow">${ASSO.nom}</p>
        <h1 style="font-size:28px;margin:var(--s2) 0 var(--s3)">Ton compte attend d'être ouvert</h1>
        <p class="muted" style="margin-bottom:var(--s4)">
          Bonjour ${me.full_name.split(" ")[0]}. Ton inscription est enregistrée. L'association
          doit maintenant vérifier deux points avant de te donner accès aux cours.</p>

        <div class="card">
          <div class="row">
            <div><p style="font-size:14px">1. Ton adhésion à l'association</p>
              <p class="muted">${ASSO.cotisation
                ? `Cotisation annuelle de ${ASSO.cotisation}.`
                : "Adhésion à régler auprès de l'association."}</p></div>
            ${ASSO.adhesionUrl
              ? html`<a href=${ASSO.adhesionUrl}><button class="ghost tiny">Adhérer</button></a>`
              : html`<span class="pill wait">à venir</span>`}
          </div>

          ${minor && html`
            <div class="row">
              <div><p style="font-size:14px">2. L'accord écrit de tes parents</p>
                <p class="muted">Obligatoire en dessous de 15 ans. L'association contactera
                  ${details?.parent_email || "ton parent"}.</p></div>
              ${ASSO.consentementUrl
                ? html`<a href=${ASSO.consentementUrl}><button class="ghost tiny">Télécharger le formulaire</button></a>`
                : html`<span class="pill wait">à venir</span>`}
            </div>

            <div style="padding-top:var(--s3)">
              <p style="font-size:14px">3. Déposer le formulaire signé</p>
              ${details?.consent_file
                ? html`<div style="display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2);flex-wrap:wrap">
                    <span class="pill live">Document déposé</span>
                    <button class="plain" onClick=${() => openFile(details.consent_file)}>
                      ${fileName(details.consent_file)}</button>
                  </div>
                  <p class="muted" style="margin-top:var(--s2)">
                    L'association va le vérifier. Tu peux en déposer un autre si besoin.</p>`
                : html`<p class="muted" style="margin-top:var(--s1)">
                    Scanne ou photographie le formulaire rempli et signé par ton parent.</p>`}
              <input type="file" accept="image/*,application/pdf" disabled=${busy}
                onChange=${sendConsent} style="margin-top:var(--s2)" />
              ${busy && html`<p class="muted" style="margin-top:var(--s2)">Envoi en cours…</p>`}
              ${err && html`<p class="error">${err}</p>`}
            </div>`}
        </div>

        <p class="muted" style="margin-top:var(--s4)">
          Une fois ces points vérifiés, ton compte sera ouvert et tu recevras l'accès
          aux cours, au forum et à ton encadrant.
          ${ASSO.contactEmail ? html` Une question ? Écris à ${ASSO.contactEmail}.` : ""}</p>

        <button class="ghost" style="margin-top:var(--s4)" onClick=${() => db.auth.signOut()}>
          Se déconnecter</button>
      </div>
    </div>`;
}

function MesCours({ me, courses, done, xp, streak, fresh, onOpen, onBadges }) {
  const lvl = levelOf(xp), into = xp % XP_PER_LEVEL;
  return html`
    <div>
      <h1 style="font-size:26px">Bonjour ${me.full_name.split(" ")[0]}</h1>
      <p class="muted" style="margin-bottom:var(--s4)">Reprends où tu t'es arrêté.</p>

      ${fresh > 0 && html`<div class="notice" style="margin-bottom:var(--s4)">
        Tu viens de débloquer ${fresh} nouveau${fresh > 1 ? "x" : ""} badge${fresh > 1 ? "s" : ""}.
        <button class="plain" style="color:#065F46;text-decoration:underline" onClick=${onBadges}>
          Aller les voir</button></div>`}

      <div class="card" style="margin-bottom:var(--s5)">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)">
          <div style="display:flex;align-items:baseline;gap:var(--s3)">
            <span style="font-family:var(--serif);font-size:30px">${xp}</span>
            <span class="muted">XP · niveau ${lvl}</span></div>
          ${streak > 0 && html`<span class="flame">
            <span style="font-family:var(--serif);font-size:18px">${streak}</span>
            <span>jour${streak > 1 ? "s" : ""} d'affilée</span></span>`}
        </div>
        <div class="track"><i style=${`width:${(into/XP_PER_LEVEL)*100}%`}></i></div>
        <p class="muted" style="margin-top:var(--s2)">${XP_PER_LEVEL-into} XP avant le niveau ${lvl+1}</p>
      </div>

      ${courses.length === 0 && html`<div class="card"><p class="muted">Aucun cours publié pour l'instant.</p></div>`}
      <div class="grid2">
        ${courses.map((c) => {
          const n = c.lessons.filter((l) => done.has(l.id)).length;
          const pct = c.lessons.length ? Math.round((n/c.lessons.length)*100) : 0;
          return html`<div class="card" key=${c.id}>
            <p class="eyebrow">${c.discipline || "Cours"}</p>
            <h3 style="font-size:21px;margin:var(--s1) 0 var(--s3)">${c.title}</h3>
            <div class="track dark" style="margin-bottom:var(--s2)"><i style=${`width:${pct}%`}></i></div>
            <p class="muted" style="margin-bottom:var(--s3)">${n} / ${c.lessons.length} leçons · ${pct} %</p>
            <button class="ghost" onClick=${() => onOpen(c.id)}>${n === 0 ? "Commencer" : "Continuer"}</button>
          </div>`;
        })}
      </div>
    </div>`;
}

function Cours({ course, done, onToggle, onBack, busy, readOnly }) {
  const firstOpen = course.lessons.find((l) => !done.has(l.id)) || course.lessons[0];
  const [activeId, setActiveId] = useState(firstOpen ? firstOpen.id : null);

  if (!course.lessons.length) return html`
    <div><button class="plain" onClick=${onBack}>← Tous les cours</button>
      <h1 style="font-size:26px;margin-top:var(--s3)">${course.title}</h1>
      <p class="muted" style="margin-top:var(--s3)">Ce cours ne contient pas encore de leçon.</p></div>`;

  const lesson = course.lessons.find((l) => l.id === activeId) || course.lessons[0];
  const index = course.lessons.findIndex((l) => l.id === lesson.id);
  const firstTodo = course.lessons.findIndex((l) => !done.has(l.id));
  const isDone = done.has(lesson.id);
  const embed = embedUrl(lesson.content_url);

  return html`
    <div>
      <button class="plain" onClick=${onBack}>← Tous les cours</button>
      <p class="eyebrow" style="margin-top:var(--s3)">${course.discipline || "Cours"}</p>
      <h1 style="font-size:26px;margin-bottom:var(--s4)">${course.title}</h1>

      <div class="split">
        <div class="card">
          ${embed
            ? html`<div style="position:relative;padding-top:56.25%;margin-bottom:var(--s4)">
                <iframe src=${embed} title=${lesson.title} allowfullscreen
                  style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:6px"></iframe></div>`
            : lesson.content_url
              ? html`<div style="margin-bottom:var(--s4)">
                  <a href=${lesson.content_url} target="_blank" rel="noopener">Ouvrir le contenu de la leçon</a></div>`
              : html`<div style="background:var(--paper);border-radius:6px;padding:var(--s6);text-align:center;margin-bottom:var(--s4)">
                  <p class="muted">Le contenu de cette leçon sera ajouté prochainement.</p></div>`}

          <p class="muted">Leçon ${index+1} sur ${course.lessons.length} · ${TYPES[lesson.type] || lesson.type}${lesson.duration_min ? ` · ${lesson.duration_min} min` : ""}</p>
          <h2 style="font-size:21px;margin:var(--s1) 0 var(--s4)">${lesson.title}</h2>
          ${lesson.body && html`<p style="margin-bottom:var(--s4);white-space:pre-wrap">${lesson.body}</p>`}

          <div style="border-top:1px solid var(--line);padding-top:var(--s3);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap">
            <span style="color:var(--xp);font-size:14px">
              ${isDone ? `${lesson.xp} XP acquis` : `+${lesson.xp} XP à la validation`}</span>
            ${readOnly
              ? html`<span class="muted">Aperçu encadrant</span>`
              : html`<button class=${isDone ? "ghost" : ""} disabled=${busy}
                       onClick=${() => onToggle(lesson.id, isDone)}>
                       ${isDone ? "Annuler la validation" : "Marquer comme terminée"}</button>`}
          </div>
        </div>

        <div class="card">
          <p class="eyebrow" style="margin-bottom:var(--s3)">Progression</p>
          ${course.lessons.map((l, i) => {
            const complete = done.has(l.id);
            const locked = !readOnly && firstTodo !== -1 && i > firstTodo;
            return html`<button key=${l.id} disabled=${locked} onClick=${() => setActiveId(l.id)}
              class=${["lesson", complete?"done":"", l.id===lesson.id?"on":""].join(" ")}>
              <span class=${["dot", complete?"done":"", l.id===lesson.id&&!complete?"here":""].join(" ")}></span>
              <span>${l.title}</span></button>`;
          })}
        </div>
      </div>
    </div>`;
}

/* ==================================================================
   7. FORUM
   ================================================================== */
function Forum({ me }) {
  const [threads, setThreads] = useState([]);
  const [open, setOpen] = useState(null);
  const [replies, setReplies] = useState([]);
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");
  const [answer, setAnswer] = useState("");
  const [writing, setWriting] = useState(false);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");

  useEffect(() => { loadThreads(); }, []);

  async function loadThreads() {
    setLoading(true);
    const { data, error } = await db.from("forum_threads")
      .select("id, title, body, created_at, author_id, profiles(full_name, role, avatar_path), forum_replies(id)")
      .order("created_at", { ascending: false });
    if (error) setErr(error.message); else setThreads(data || []);
    setLoading(false);
  }

  async function openThread(t) {
    setOpen(t); setReplies([]);
    const { data } = await db.from("forum_replies")
      .select("id, body, created_at, author_id, profiles(full_name, role, avatar_path)")
      .eq("thread_id", t.id).order("created_at");
    setReplies(data || []);
  }

  async function post(e) {
    e.preventDefault();
    if (title.trim().length < 5) return;
    const { error } = await db.from("forum_threads")
      .insert({ author_id: me.id, title: title.trim(), body: body.trim() || null });
    if (error) setErr(error.message);
    else { setTitle(""); setBody(""); setWriting(false); loadThreads(); }
  }

  async function reply(e) {
    e.preventDefault();
    if (!answer.trim()) return;
    const { error } = await db.from("forum_replies")
      .insert({ thread_id: open.id, author_id: me.id, body: answer.trim() });
    if (error) setErr(error.message); else { setAnswer(""); openThread(open); }
  }

  async function remove(id, table, after) {
    if (!confirm("Supprimer définitivement ?")) return;
    await db.from(table).delete().eq("id", id); after();
  }

  if (open) return html`
    <div>
      <button class="plain" onClick=${() => { setOpen(null); loadThreads(); }}>← Retour au forum</button>
      <h1 style="font-size:24px;margin:var(--s3) 0 var(--s1)">${open.title}</h1>
      <p class="muted" style="margin-bottom:var(--s4)">${open.profiles?.full_name || "Anonyme"}<${Role} role=${open.profiles?.role} /> · ${since(open.created_at)}</p>
      ${open.body && html`<div class="card" style="margin-bottom:var(--s4)"><p style="white-space:pre-wrap">${open.body}</p></div>`}
      <div class="card">
        ${replies.length === 0 && html`<p class="muted">Aucune réponse pour l'instant.</p>`}
        ${replies.map((r) => html`<div class="row" key=${r.id} style="align-items:flex-start">
          <div style="flex:1">
            <p class="muted" style="margin-bottom:var(--s1)">${r.profiles?.full_name || "Anonyme"}<${Role} role=${r.profiles?.role} /> · ${since(r.created_at)}</p>
            <p style="white-space:pre-wrap">${r.body}</p></div>
          ${(r.author_id === me.id || me.role !== "eleve") && html`
            <button class="danger" onClick=${() => remove(r.id, "forum_replies", () => openThread(open))}>Supprimer</button>`}
        </div>`)}
      </div>
      <form onSubmit=${reply} style="margin-top:var(--s4)">
        <label>Ta réponse</label>
        <textarea value=${answer} onInput=${(e)=>setAnswer(e.target.value)}></textarea>
        <button style="margin-top:var(--s2)" disabled=${!answer.trim()}>Répondre</button>
      </form>
      ${err && html`<p class="error">${err}</p>`}
    </div>`;

  return html`
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)">
        <div><h1 style="font-size:26px">Forum général</h1>
          <p class="muted">Pose tes questions, partage tes fiches, entraide-toi.</p></div>
        <button onClick=${() => setWriting(!writing)}>${writing ? "Annuler" : "Nouvelle discussion"}</button>
      </div>
      ${writing && html`<form class="card" onSubmit=${post} style="margin-bottom:var(--s4)">
        <div class="field"><label>Sujet</label>
          <input value=${title} onInput=${(e)=>setTitle(e.target.value)} /></div>
        <div class="field"><label>Message (facultatif)</label>
          <textarea value=${body} onInput=${(e)=>setBody(e.target.value)}></textarea></div>
        <button disabled=${title.trim().length < 5}>Publier</button></form>`}
      ${loading && html`<p class="muted">Chargement…</p>`}
      ${!loading && threads.length === 0 && html`<div class="card"><p class="muted">Le forum est vide.</p></div>`}
      <div class="card" style="padding:var(--s2)">
        ${threads.map((t) => html`<div key=${t.id} style="display:flex;align-items:center;gap:var(--s2)">
          <button class="rowbtn" onClick=${() => openThread(t)}>
            <span style="display:block">${t.title}</span>
            <span class="muted">${t.profiles?.full_name || "Anonyme"}<${Role} role=${t.profiles?.role} /> · ${(t.forum_replies||[]).length} réponses · ${since(t.created_at)}</span>
          </button>
          ${(t.author_id === me.id || me.role !== "eleve") && html`
            <button class="danger" style="padding-right:var(--s3)"
              onClick=${() => remove(t.id, "forum_threads", loadThreads)}>Supprimer</button>`}
        </div>`)}
      </div>
      ${err && html`<p class="error">${err}</p>`}
    </div>`;
}

/* ==================================================================
   8. MESSAGERIE
   ================================================================== */
function Messagerie({ me, students, tags }) {
  const staff = me.role !== "eleve";
  const [target, setTarget] = useState(staff ? (students[0]?.id || null) : me.id);
  const [msgs, setMsgs] = useState([]);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const endRef = useRef(null);

  useEffect(() => { if (target) loadMsgs(); }, [target]);
  useEffect(() => { endRef.current?.scrollIntoView({ block: "nearest" }); }, [msgs]);

  async function loadMsgs() {
    const { data, error } = await db.from("messages")
      .select("id, body, created_at, sender_id, read_at, profiles!messages_sender_id_fkey(full_name, role, avatar_path)")
      .eq("student_id", target).order("created_at");
    if (error) { setErr(error.message); return; }
    setMsgs(data || []);
    const unread = (data || []).filter((m) => m.sender_id !== me.id && !m.read_at).map((m) => m.id);
    if (unread.length) await db.from("messages").update({ read_at: new Date().toISOString() }).in("id", unread);
  }

  async function send(e) {
    e.preventDefault();
    if (!text.trim() || !target) return;
    setBusy(true);
    const { error } = await db.from("messages").insert({ student_id: target, sender_id: me.id, body: text.trim() });
    if (error) setErr(error.message); else { setText(""); loadMsgs(); }
    setBusy(false);
  }

  const panel = html`
    <div>
      <div class="card" style="min-height:280px;max-height:460px;overflow-y:auto">
        ${msgs.length === 0 && html`<p class="muted">
          ${staff ? "Aucun message avec cet élève." : "Aucun message. Écris à ton encadrant, il te répondra."}</p>`}
        ${msgs.map((m) => html`<div key=${m.id} class=${"msgline" + (m.sender_id === me.id ? " mine" : "")}>
          <span class="muted" style="font-size:12px">
            ${m.sender_id === me.id ? "Toi" : (m.profiles?.full_name || "Encadrant")} · ${since(m.created_at)}</span>
          <span class=${"bubble" + (m.sender_id === me.id ? " mine" : "")}>${m.body}</span>
        </div>`)}
        <div ref=${endRef}></div>
      </div>
      <form onSubmit=${send} style="display:flex;gap:var(--s2);margin-top:var(--s3)">
        <input value=${text} onInput=${(e)=>setText(e.target.value)} placeholder="Écrire un message…" />
        <button disabled=${busy || !text.trim()}>Envoyer</button>
      </form>
      ${err && html`<p class="error">${err}</p>`}
    </div>`;

  if (!staff) return html`
    <div>
      <h1 style="font-size:26px">Mon encadrant</h1>
      <p class="warn" style="margin:var(--s3) 0 var(--s4)">
        Cette conversation est privée vis-à-vis des autres élèves. Elle reste
        consultable par les responsables de l'association, qui veillent à la
        sécurité des échanges entre adultes et mineurs.</p>
      <${CarteEncadrant} tutorId=${me.tutor_id} tags=${tags || []} />
      <div style="margin-top:var(--s3)">${panel}</div>
    </div>`;

  return html`
    <div>
      <h1 style="font-size:26px">Messagerie</h1>
      <p class="muted" style="margin-bottom:var(--s4)">
        ${me.role === "admin"
          ? "Toutes les conversations de l'association, y compris celles des encadrants."
          : "Les conversations de tes élèves rattachés."}</p>
      ${students.length === 0
        ? html`<div class="card"><p class="muted">Aucun élève à afficher.</p></div>`
        : html`<div class="split3">
            <div class="card" style="padding:var(--s2);align-self:start">
              ${students.map((s) => html`<button key=${s.id}
                class=${"rowbtn" + (s.id === target ? " on" : "")} onClick=${() => setTarget(s.id)}>
                <span style="display:block;font-size:14px">${s.full_name}</span>
                ${s.unread > 0 && html`<span class="pill unread">${s.unread} non lu</span>`}
              </button>`)}
            </div>
            ${panel}
          </div>`}
    </div>`;
}

/* ==================================================================
   8bis. DEVOIRS — CÔTÉ ÉLÈVE
   ================================================================== */
function Devoirs({ me, reload }) {
  const [items, setItems] = useState([]);
  const [subs, setSubs] = useState({});
  const [pts, setPts] = useState({});
  const [open, setOpen] = useState(null);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(true);

  useEffect(() => { load(); }, []);

  async function load() {
    setLoading(true); setErr("");
    const { data: a, error: e1 } = await db.from("assignments")
      .select("id, title, instructions, due_at, max_score, xp, position, courses(title)")
      .eq("published", true);
    if (e1) setErr(e1.message);
    setItems((a || []).sort((x, y) => (x.due_at || "9") .localeCompare(y.due_at || "9")));

    const { data: s } = await db.from("submissions").select("*").eq("student_id", me.id);
    setSubs(Object.fromEntries((s || []).map((x) => [x.assignment_id, x])));

    const { data: p } = await db.from("submission_xp").select("*").eq("student_id", me.id);
    setPts(Object.fromEntries((p || []).map((x) => [x.assignment_id, x])));
    setLoading(false);
  }

  async function submit(assignment, file) {
    setBusy(true); setErr("");
    let path = subs[assignment.id]?.file_path || null;
    if (file) {
      const res = await uploadFile("devoirs", me.id, file);
      if (res.error) { setErr(res.error); setBusy(false); return; }
      path = res.path;
    }
    const existing = subs[assignment.id];
    const payload = { file_path: path, note_text: text.trim() || null, submitted_at: new Date().toISOString() };
    const { error } = existing
      ? await db.from("submissions").update(payload).eq("id", existing.id)
      : await db.from("submissions").insert({ assignment_id: assignment.id, student_id: me.id, ...payload });
    if (error) setErr(error.message);
    else { setText(""); await load(); await reload(); }
    setBusy(false);
  }

  if (loading) return html`<p class="muted">Chargement des devoirs…</p>`;

  if (open) {
    const a = items.find((x) => x.id === open);
    if (!a) return html`<button class="plain" onClick=${() => setOpen(null)}>← Retour</button>`;
    const sub = subs[a.id], p = pts[a.id], dl = deadline(a.due_at);
    const graded = sub?.graded_at;
    return html`
      <div>
        <button class="plain" onClick=${() => { setOpen(null); setText(""); }}>← Tous les devoirs</button>
        <p class="eyebrow" style="margin-top:var(--s3)">${a.courses?.title || "Devoir"}</p>
        <h1 style="font-size:26px;margin-bottom:var(--s2)">${a.title}</h1>
        <p class=${dl.late ? "muted" : "muted"} style=${dl.late ? "color:var(--alert)" : ""}>
          ${dl.label} · barème sur ${a.max_score} · ${a.xp} XP de référence</p>

        ${a.instructions && html`<div class="card" style="margin-top:var(--s4)">
          <p class="eyebrow" style="margin-bottom:var(--s2)">Consigne</p>
          <p style="white-space:pre-wrap">${a.instructions}</p></div>`}

        ${graded ? html`
          <div class="card">
            <p class="eyebrow" style="margin-bottom:var(--s3)">Correction</p>
            <div style="display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3)">
              <span style="font-family:var(--serif);font-size:32px">${sub.score}</span>
              <span class="muted">/ ${a.max_score}</span></div>
            ${sub.feedback && html`<p style="white-space:pre-wrap;margin-bottom:var(--s3)">${sub.feedback}</p>`}
            ${p && html`<div style="border-top:1px solid var(--line);padding-top:var(--s3)">
              <p class="eyebrow" style="margin-bottom:var(--s2)">XP obtenus</p>
              <dl class="dl">
                <dt>Dépôt${p.late ? " (en retard)" : ""}</dt><dd>${p.xp_depot} XP</dd>
                <dt>Note</dt><dd>${p.xp_note} XP</dd>
                ${p.xp_bonus > 0 && html`<dt>Bonus d'excellence</dt><dd>${p.xp_bonus} XP</dd>`}
                <dt style="color:var(--ink)">Total</dt>
                <dd style="color:var(--xp)">${p.xp_depot + p.xp_note + p.xp_bonus} XP</dd>
              </dl></div>`}
          </div>` : html`
          <div class="card">
            <p class="eyebrow" style="margin-bottom:var(--s3)">
              ${sub ? "Ton rendu" : "Rendre ce devoir"}</p>
            ${sub && html`<div style="margin-bottom:var(--s3)">
              <span class="pill live">Rendu le ${dateTimeFr(sub.submitted_at)}</span>
              ${sub.file_path && html` <button class="plain" style="margin-left:var(--s2)"
                onClick=${() => openFile(sub.file_path)}>${fileName(sub.file_path)}</button>`}
              ${p && html`<p class="muted" style="margin-top:var(--s2)">
                ${p.xp_depot} XP acquis au dépôt. Le reste viendra avec la correction.</p>`}
            </div>`}
            ${sub?.note_text && html`<p class="muted" style="margin-bottom:var(--s3);white-space:pre-wrap">${sub.note_text}</p>`}

            <div class="field"><label>Ton fichier (PDF, photo, document)</label>
              <input type="file" accept="image/*,application/pdf,.doc,.docx,.odt" disabled=${busy}
                onChange=${(e) => e.target.files[0] && submit(a, e.target.files[0])} /></div>
            <div class="field"><label>Ou un commentaire à joindre</label>
              <textarea value=${text} onInput=${(e)=>setText(e.target.value)}
                placeholder="Une remarque pour ton encadrant…"></textarea></div>
            <button disabled=${busy || (!text.trim() && !sub)} onClick=${() => submit(a, null)}>
              ${busy ? "Envoi…" : sub ? "Mettre à jour mon rendu" : "Rendre sans fichier"}</button>
            ${dl.late && !sub && html`<p class="warn" style="margin-top:var(--s3)">
              L'échéance est passée. Tu peux encore rendre, mais la part d'XP du dépôt est réduite de moitié.</p>`}
          </div>`}
        ${err && html`<p class="error">${err}</p>`}
      </div>`;
  }

  return html`
    <div>
      <h1 style="font-size:26px">Devoirs</h1>
      <p class="muted" style="margin-bottom:var(--s4)">
        La moitié des XP est acquise au dépôt, l'autre dépend de ta note.</p>
      ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}
      ${items.length === 0 && html`<div class="card"><p class="muted">Aucun devoir pour l'instant.</p></div>`}
      ${items.map((a) => {
        const sub = subs[a.id], dl = deadline(a.due_at);
        const state = sub?.graded_at ? "corrigé" : sub ? "rendu" : dl.late ? "en retard" : "à rendre";
        return html`<div class="card" key=${a.id}>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap">
            <div style="min-width:0">
              <p class="eyebrow">${a.courses?.title || "Devoir"}</p>
              <p style="font-size:17px;margin:var(--s1) 0">${a.title}</p>
              <p class="muted" style=${dl.late && !sub ? "color:var(--alert)" : ""}>${dl.label}</p>
            </div>
            <div style="display:flex;align-items:center;gap:var(--s3)">
              ${sub?.graded_at
                ? html`<span style="font-family:var(--serif);font-size:22px">${sub.score}<span class="muted" style="font-size:13px"> / ${a.max_score}</span></span>`
                : html`<span class=${"pill " + (sub ? "live" : dl.late ? "off" : "wait")}>${state}</span>`}
              <button class="ghost tiny" onClick=${() => { setOpen(a.id); setText(""); }}>Ouvrir</button>
            </div>
          </div>
        </div>`;
      })}
    </div>`;
}

/* ==================================================================

const EMPTY_ASSIGN = { title:"", course_id:"", instructions:"", due_at:"", max_score:20, xp:100 };

function DevoirsAdmin({ me, courses, reload }) {
  const [items, setItems] = useState([]);
  const [sel, setSel] = useState(null);
  const [subs, setSubs] = useState([]);
  const [draft, setDraft] = useState(null);
  const [editing, setEdit] = useState(null);
  const [grade, setGrade] = useState(null);
  const [err, setErr] = useState("");

  useEffect(() => { load(); }, []);
  useEffect(() => { if (sel) loadSubs(sel); }, [sel]);

  async function load() {
    const { data, error } = await db.from("assignments")
      .select("id, title, instructions, due_at, max_score, xp, published, course_id, courses(title)")
      .order("created_at", { ascending:false });
    if (error) setErr(error.message); else setItems(data || []);
  }

  async function loadSubs(id) {
    const { data } = await db.from("submissions")
      .select("*, profiles!submissions_student_id_fkey(full_name)")
      .eq("assignment_id", id).order("submitted_at");
    setSubs(data || []);
  }

  async function save(e) {
    e.preventDefault();
    const payload = {
      title: draft.title.trim(),
      course_id: draft.course_id || null,
      instructions: draft.instructions.trim() || null,
      due_at: draft.due_at ? new Date(draft.due_at).toISOString() : null,
      max_score: Number(draft.max_score) || 20,
      xp: Number(draft.xp) || 100,
    };
    const { error } = editing
      ? await db.from("assignments").update(payload).eq("id", editing)
      : await db.from("assignments").insert({ ...payload, created_by: me.id, published: false });
    if (error) setErr(error.message);
    else { setDraft(null); setEdit(null); await load(); }
  }

  async function saveGrade(e) {
    e.preventDefault();
    const { error } = await db.from("submissions").update({
      score: Number(grade.score), feedback: grade.feedback.trim() || null,
      graded_by: me.id, graded_at: new Date().toISOString(),
    }).eq("id", grade.id);
    if (error) setErr(error.message);
    else { setGrade(null); await loadSubs(sel); await reload(); }
  }

  const current = items.find((a) => a.id === sel);

  return html`
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)">
        <div><h1 style="font-size:26px">Devoirs</h1>
          <p class="muted">Crée les sujets, fixe les échéances, corrige les rendus.</p></div>
        <button onClick=${() => { setDraft(draft ? null : {...EMPTY_ASSIGN}); setEdit(null); }}>
          ${draft && !editing ? "Annuler" : "Nouveau devoir"}</button>
      </div>
      ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}

      ${draft && html`<form class="card" onSubmit=${save} style="margin-bottom:var(--s4)">
        <p class="eyebrow" style="margin-bottom:var(--s3)">${editing ? "Modifier le devoir" : "Nouveau devoir"}</p>
        <div class="field"><label>Titre</label>
          <input value=${draft.title} onInput=${(e)=>setDraft({...draft,title:e.target.value})} /></div>
        <div class="field"><label>Cours rattaché (facultatif)</label>
          <select value=${draft.course_id} onChange=${(e)=>setDraft({...draft,course_id:e.target.value})}>
            <option value="">Aucun</option>
            ${courses.map((c) => html`<option key=${c.id} value=${c.id}>${c.title}</option>`)}
          </select></div>
        <div class="field"><label>Consigne</label>
          <textarea value=${draft.instructions} onInput=${(e)=>setDraft({...draft,instructions:e.target.value})}
            placeholder="Sujet, attentes, longueur, méthode…"></textarea></div>
        <div class="grid2">
          <div class="field"><label>Échéance (laisser vide = aucune)</label>
            <input type="datetime-local" value=${draft.due_at}
              onInput=${(e)=>setDraft({...draft,due_at:e.target.value})} /></div>
          <div class="field"><label>Barème (note maximale)</label>
            <input type="number" step="0.5" value=${draft.max_score}
              onInput=${(e)=>setDraft({...draft,max_score:e.target.value})} /></div>
        </div>
        <div class="field" style="max-width:200px"><label>XP de référence</label>
          <input type="number" value=${draft.xp} onInput=${(e)=>setDraft({...draft,xp:e.target.value})} /></div>
        <p class="muted" style="margin-bottom:var(--s3)">
          Sur ${draft.xp || 100} XP : ${Math.round((draft.xp||100)*0.5)} au dépôt dans les délais
          (${Math.round((draft.xp||100)*0.25)} en retard), jusqu'à ${Math.round((draft.xp||100)*0.5)} selon la note,
          et ${Math.round((draft.xp||100)*0.25)} de bonus au-delà de 80 % du barème.</p>
        <div style="display:flex;gap:var(--s2)">
          <button disabled=${draft.title.trim().length < 3}>${editing ? "Enregistrer" : "Créer"}</button>
          <button type="button" class="ghost" onClick=${() => { setDraft(null); setEdit(null); }}>Annuler</button>
        </div>
      </form>`}

      <div class="split3">
        <div class="card" style="padding:var(--s2);align-self:start">
          ${items.length === 0 && html`<p class="muted" style="padding:var(--s2)">Aucun devoir.</p>`}
          ${items.map((a) => html`<button key=${a.id} class=${"rowbtn" + (a.id===sel?" on":"")}
            onClick=${() => setSel(a.id)}>
            <span style="display:block;font-size:14px">${a.title}</span>
            <span class=${"pill" + (a.published?" live":"")}>${a.published?"Publié":"Brouillon"}</span>
          </button>`)}
        </div>

        ${!current ? html`<div class="card"><p class="muted">Sélectionne un devoir pour voir les rendus.</p></div>` : html`
          <div>
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap">
                <div><p class="eyebrow">${current.courses?.title || "Sans cours"}</p>
                  <h2 style="font-size:22px;margin-top:var(--s1)">${current.title}</h2>
                  <p class="muted" style="margin-top:var(--s1)">
                    ${deadline(current.due_at).label} · sur ${current.max_score} · ${current.xp} XP</p></div>
                <div style="display:flex;gap:var(--s2);align-items:center">
                  <button class="ghost tiny" onClick=${async () => {
                    await db.from("assignments").update({ published: !current.published }).eq("id", current.id);
                    await load(); }}>${current.published ? "Dépublier" : "Publier"}</button>
                  <button class="ghost tiny" onClick=${() => { setEdit(current.id); setDraft({
                    title: current.title, course_id: current.course_id || "",
                    instructions: current.instructions || "",
                    due_at: current.due_at ? new Date(current.due_at).toISOString().slice(0,16) : "",
                    max_score: current.max_score, xp: current.xp }); }}>Modifier</button>
                  <button class="danger" onClick=${async () => {
                    if (!confirm("Supprimer ce devoir et tous les rendus ?")) return;
                    await db.from("assignments").delete().eq("id", current.id);
                    setSel(null); await load(); await reload(); }}>Supprimer</button>
                </div>
              </div>
              ${current.instructions && html`<p class="muted" style="margin-top:var(--s3);white-space:pre-wrap">${current.instructions}</p>`}
            </div>

            <div class="card">
              <p class="eyebrow" style="margin-bottom:var(--s3)">${subs.length} rendus</p>
              ${subs.length === 0 && html`<p class="muted">Aucun rendu pour l'instant.</p>`}
              ${subs.map((s) => html`<div class="row" key=${s.id}>
                <div style="flex:1;min-width:0">
                  <span style="font-size:14px">${s.profiles?.full_name || "Élève"}</span>
                  <span class="muted" style="display:block">
                    Rendu le ${dateTimeFr(s.submitted_at)}
                    ${current.due_at && new Date(s.submitted_at) > new Date(current.due_at) ? " · en retard" : ""}</span>
                  ${s.note_text && html`<span class="muted" style="display:block;white-space:pre-wrap">${s.note_text}</span>`}
                </div>
                <div style="display:flex;gap:var(--s2);align-items:center;flex-shrink:0">
                  ${s.file_path && html`<button class="ghost tiny" onClick=${() => openFile(s.file_path)}>Ouvrir</button>`}
                  ${s.graded_at
                    ? html`<span class="pill live">${s.score} / ${current.max_score}</span>`
                    : html`<span class="pill wait">à corriger</span>`}
                  <button class="ghost tiny" onClick=${() => setGrade({
                    id: s.id, score: s.score ?? "", feedback: s.feedback || "", name: s.profiles?.full_name })}>
                    ${s.graded_at ? "Revoir" : "Corriger"}</button>
                </div>
              </div>`)}

              ${grade && html`<form onSubmit=${saveGrade} style="border-top:1px solid var(--line);margin-top:var(--s3);padding-top:var(--s4)">
                <p class="eyebrow" style="margin-bottom:var(--s3)">Correction — ${grade.name}</p>
                <div class="field" style="max-width:200px"><label>Note sur ${current.max_score}</label>
                  <input type="number" step="0.5" min="0" max=${current.max_score} required
                    value=${grade.score} onInput=${(e)=>setGrade({...grade,score:e.target.value})} /></div>
                <div class="field"><label>Appréciation</label>
                  <textarea value=${grade.feedback} onInput=${(e)=>setGrade({...grade,feedback:e.target.value})}
                    placeholder="Ce qui fonctionne, ce qu'il faut retravailler…"></textarea></div>
                <div style="display:flex;gap:var(--s2)">
                  <button class="ok">Enregistrer la correction</button>
                  <button type="button" class="ghost" onClick=${() => setGrade(null)}>Annuler</button>
                </div>
              </form>`}
            </div>
          </div>`}
      </div>
    </div>`;
}

/* ==================================================================
   8quater. BADGES ET MISSIONS
   ================================================================== */
const RULE_LABEL = {
  lessons:     (v) => `${v} leçon${v > 1 ? "s" : ""} validée${v > 1 ? "s" : ""}`,
  assignments: (v) => `${v} devoir${v > 1 ? "s" : ""} rendu${v > 1 ? "s" : ""}`,
  streak:      (v) => `${v} jours d'affilée`,
  forum:       (v) => `${v} messages sur le forum`,
  xp:          (v) => `${v} XP au total`,
  grade:       (v) => `une note d'au moins ${Math.round(v * 20)}/20`,
};

function Medal({ badge, locked }) {
  return html`<div class=${"medal " + (locked ? "" : badge.tier)}>${badge.monogram}</div>`;
}

function Badges({ me }) {
  const [all, setAll] = useState([]);
  const [mine, setMine] = useState({});
  const [prog, setProg] = useState({});
  const [loading, setLoading] = useState(true);

  useEffect(() => { load(); }, []);

  async function load() {
    setLoading(true);
    const { data: b } = await db.from("badges").select("*").order("position");
    setAll(b || []);
    const { data: u } = await db.from("user_badges")
      .select("badge_id, awarded_at, note, profiles!user_badges_awarded_by_fkey(full_name)")
      .eq("user_id", me.id);
    setMine(Object.fromEntries((u || []).map((x) => [x.badge_id, x])));
    const { data: p } = await db.rpc("my_progress");
    setProg(Object.fromEntries((p || []).map((x) => [x.rule_type, Number(x.current_value)])));
    setLoading(false);
  }

  if (loading) return html`<p class="muted">Chargement des badges…</p>`;

  const won = all.filter((b) => mine[b.id]);
  const autoLeft = all.filter((b) => !mine[b.id] && b.kind === "auto");
  const manualLeft = all.filter((b) => !mine[b.id] && b.kind === "manuel");

  const card = (b, locked) => {
    const got = mine[b.id];
    const cur = b.rule_type ? (prog[b.rule_type] ?? 0) : null;
    const goal = b.rule_value !== null ? Number(b.rule_value) : null;
    return html`<div class=${"badge" + (locked ? " locked" : "")} key=${b.id} title=${b.description}>
      <${Medal} badge=${b} locked=${locked} />
      <p class="bname">${b.name}</p>
      <p class="muted" style="font-size:12px">${b.description}</p>
      ${!locked && got && html`<p class="muted" style="font-size:12px;margin-top:var(--s2);color:var(--ok)">
        Obtenu le ${dateFr(got.awarded_at)}
        ${got.profiles?.full_name ? ` par ${got.profiles.full_name}` : ""}</p>`}
      ${!locked && got?.note && html`<p class="muted" style="font-size:12px;font-style:italic">« ${got.note} »</p>`}
      ${locked && goal !== null && b.rule_type && html`
        <div style="margin-top:var(--s2)">
          <div class="track dark"><i style=${`width:${Math.min(100, (cur / goal) * 100)}%`}></i></div>
          <p class="muted" style="font-size:12px;margin-top:var(--s1)">
            ${b.rule_type === "grade"
              ? RULE_LABEL.grade(goal)
              : `${Math.floor(cur)} / ${goal} — ${RULE_LABEL[b.rule_type](goal)}`}</p>
        </div>`}
      ${locked && !b.rule_type && html`<p class="muted" style="font-size:12px;margin-top:var(--s2)">
        Attribué par un encadrant</p>`}
    </div>`;
  };

  return html`
    <div>
      <h1 style="font-size:26px">Badges</h1>
      <p class="muted" style="margin-bottom:var(--s4)">
        ${won.length} obtenus sur ${all.length}. Les badges ne rapportent pas d'XP :
        ils marquent le chemin parcouru.</p>

      ${won.length > 0 && html`
        <p class="eyebrow" style="margin-bottom:var(--s3)">Obtenus</p>
        <div class="badges" style="margin-bottom:var(--s5)">${won.map((b) => card(b, false))}</div>`}

      ${autoLeft.length > 0 && html`
        <p class="eyebrow" style="margin-bottom:var(--s3)">Missions en cours</p>
        <div class="badges" style="margin-bottom:var(--s5)">${autoLeft.map((b) => card(b, true))}</div>`}

      ${manualLeft.length > 0 && html`
        <p class="eyebrow" style="margin-bottom:var(--s3)">Distinctions de l'encadrement</p>
        <div class="badges">${manualLeft.map((b) => card(b, true))}</div>`}
    </div>`;
}

/* --- Bloc badges dans la fiche élève, avec attribution manuelle --- */
function BadgesFiche({ me, studentId }) {
  const [all, setAll] = useState([]);
  const [mine, setMine] = useState({});
  const [pick, setPick] = useState("");
  const [note, setNote] = useState("");
  const [err, setErr] = useState("");

  useEffect(() => { load(); }, [studentId]);

  async function load() {
    const { data: b } = await db.from("badges").select("*").order("position");
    setAll(b || []);
    const { data: u } = await db.from("user_badges")
      .select("badge_id, awarded_at, note").eq("user_id", studentId);
    setMine(Object.fromEntries((u || []).map((x) => [x.badge_id, x])));
  }

  async function award() {
    if (!pick) return;
    const { error } = await db.from("user_badges").insert({
      user_id: studentId, badge_id: pick, awarded_by: me.id, note: note.trim() || null });
    if (error) setErr(error.message);
    else { setPick(""); setNote(""); setErr(""); await load(); }
  }

  const won = all.filter((b) => mine[b.id]);
  const givable = all.filter((b) => !mine[b.id] && b.kind === "manuel");

  return html`
    <div class="card">
      <p class="eyebrow" style="margin-bottom:var(--s3)">Badges — ${won.length} obtenus</p>
      ${won.length === 0 && html`<p class="muted">Aucun badge pour l'instant.</p>`}
      ${won.length > 0 && html`<div style="display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s3)">
        ${won.map((b) => html`<span key=${b.id} class="pill" title=${b.description}>${b.monogram} ${b.name}</span>`)}
      </div>`}

      ${givable.length > 0 && html`
        <div style="border-top:1px solid var(--line);padding-top:var(--s3)">
          <label>Attribuer une distinction</label>
          <select value=${pick} onChange=${(e) => setPick(e.target.value)} style="margin-bottom:var(--s2)">
            <option value="">Choisir…</option>
            ${givable.map((b) => html`<option key=${b.id} value=${b.id}>${b.name}</option>`)}
          </select>
          ${pick && html`<textarea value=${note} onInput=${(e) => setNote(e.target.value)}
            placeholder="Un mot pour l'élève (facultatif)" style="margin-bottom:var(--s2)"></textarea>`}
          <button class="ok tiny" disabled=${!pick} onClick=${award}>Attribuer</button>
          ${err && html`<p class="error">${err}</p>`}
        </div>`}
    </div>`;
}

/* ==================================================================
   8quinquies. MON PROFIL (ENCADREMENT)

function Profil({ me, reload }) {
  const [f, setF] = useState(null);
  const [tags, setTags] = useState([]);
  const [avail, setAvail] = useState({ hours_per_week:"", note:"" });
  const [month, setMonth] = useState(monthStart(0));
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");

  useEffect(() => { load(); }, []);
  useEffect(() => { loadAvail(month); }, [month]);

  async function load() {
    const { data: p } = await db.from("profiles")
      .select("full_name, bio, bio_correction, correct_anonymously, subjects, avatar_path")
      .eq("id", me.id).single();
    setF({ ...p, subjects: p?.subjects || [] });
    const { data: t } = await db.from("subject_tags").select("*").order("position");
    setTags(t || []);
  }

  async function loadAvail(m) {
    const { data } = await db.from("staff_availability")
      .select("hours_per_week, note").eq("user_id", me.id).eq("month", m).maybeSingle();
    setAvail({ hours_per_week: data?.hours_per_week ?? "", note: data?.note || "" });
  }

  async function savePhoto(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { setErr("La photo ne doit pas dépasser 2 Mo."); return; }
    setBusy(true); setErr(""); setMsg("");
    const path = `${me.id}/photo-${Date.now()}-${file.name.replace(/[^\w.\-]/g, "_")}`;
    const { error } = await db.storage.from("avatars").upload(path, file, { upsert:true });
    if (error) setErr(error.message);
    else {
      const { error: e2 } = await db.from("profiles").update({ avatar_path: path }).eq("id", me.id);
      if (e2) setErr(e2.message);
      else { setMsg("Photo mise à jour."); await load(); await reload(); }
    }
    setBusy(false);
  }

  async function saveProfile() {
    setBusy(true); setErr(""); setMsg("");
    const { error } = await db.from("profiles").update({
      bio: f.bio?.trim() || null,
      bio_correction: f.bio_correction?.trim() || null,
      correct_anonymously: !!f.correct_anonymously,
      subjects: f.subjects,
    }).eq("id", me.id);
    if (error) setErr(error.message);
    else { setMsg("Profil enregistré."); await reload(); }
    setBusy(false);
  }

  async function saveAvail() {
    setBusy(true); setErr(""); setMsg("");
    const { error } = await db.from("staff_availability").upsert({
      user_id: me.id, month,
      hours_per_week: Number(avail.hours_per_week) || 0,
      note: avail.note?.trim() || null,
      updated_at: new Date().toISOString(),
    }, { onConflict: "user_id,month" });
    if (error) setErr(error.message);
    else setMsg(`Engagement enregistré pour ${monthLabel(month)}.`);
    setBusy(false);
  }

  if (!f) return html`<p class="muted">Chargement du profil…</p>`;

  const toggleTag = (code) => setF({ ...f,
    subjects: f.subjects.includes(code)
      ? f.subjects.filter((s) => s !== code)
      : [...f.subjects, code] });

  return html`
    <div>
      <h1 style="font-size:26px">Mon profil</h1>
      <p class="muted" style="margin-bottom:var(--s4)">
        Ce que tes élèves voient de toi, et ce que le bureau utilise pour répartir le travail.</p>
      ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}
      ${msg && html`<p class="notice" style="margin-bottom:var(--s3)">${msg}</p>`}

      <div class="card">
        <p class="eyebrow" style="margin-bottom:var(--s3)">Photo</p>
        <div style="display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap">
          <${Avatar} name=${f.full_name} path=${f.avatar_path} size=${72} />
          <div style="flex:1;min-width:200px">
            <input type="file" accept="image/*" disabled=${busy} onChange=${savePhoto} />
            <p class="muted" style="margin-top:var(--s2)">
              Visible par tes élèves. Format carré de préférence, 2 Mo maximum.</p>
          </div>
        </div>
      </div>

      <div class="card">
        <p class="eyebrow" style="margin-bottom:var(--s3)">Présentation</p>
        <div class="field"><label>Qui es-tu ? — visible par tes élèves</label>
          <textarea value=${f.bio || ""} onInput=${(e) => setF({ ...f, bio:e.target.value })}
            placeholder="Ton parcours, ton IEP, ce que tu aimes transmettre…"></textarea></div>

        <div class="field"><label>Ta manière de corriger — affichée avec les copies rendues</label>
          <textarea value=${f.bio_correction || ""} onInput=${(e) => setF({ ...f, bio_correction:e.target.value })}
            placeholder="Ce sur quoi tu insistes, ce que tu attends d'une copie…"></textarea></div>

        <label class="check" style="margin-bottom:var(--s3)">
          <input type="checkbox" checked=${!!f.correct_anonymously}
            onChange=${(e) => setF({ ...f, correct_anonymously:e.target.checked })} />
          <span>Corriger sous anonymat. Les élèves verront « un correcteur de l'équipe »
            au lieu de ton nom. Le bureau, lui, sait toujours qui a corrigé.</span>
        </label>

        <div class="field">
          <label>Matières que tu préfères encadrer</label>
          <div class="tags">
            ${tags.map((t) => html`<span key=${t.code}
              class=${"tag" + (f.subjects.includes(t.code) ? " on" : "")}
              onClick=${() => toggleTag(t.code)}>${t.label}</span>`)}
          </div>
        </div>

        <button disabled=${busy} onClick=${saveProfile}>Enregistrer mon profil</button>
      </div>

      <div class="card">
        <p class="eyebrow" style="margin-bottom:var(--s3)">Mon engagement</p>
        <p class="muted" style="margin-bottom:var(--s3)">
          Combien de temps peux-tu donner par semaine ? À réajuster chaque mois — mieux vaut
          annoncer deux heures et les tenir que cinq et décrocher.</p>
        <div class="grid2">
          <div class="field"><label>Mois concerné</label>
            <select value=${month} onChange=${(e) => setMonth(e.target.value)}>
              ${[0,1,2].map((o) => html`<option key=${o} value=${monthStart(o)}>${monthLabel(monthStart(o))}</option>`)}
            </select></div>
          <div class="field"><label>Heures par semaine</label>
            <input type="number" step="0.5" min="0" value=${avail.hours_per_week}
              onInput=${(e) => setAvail({ ...avail, hours_per_week:e.target.value })} /></div>
        </div>
        <div class="field"><label>Précision (facultatif)</label>
          <input value=${avail.note} onInput=${(e) => setAvail({ ...avail, note:e.target.value })}
            placeholder="Plutôt le week-end, indisponible la semaine du 12…" /></div>
        <button class="ghost" disabled=${busy} onClick=${saveAvail}>Enregistrer l'engagement</button>
      </div>
    </div>`;
}

/* ==================================================================
   8sexies. ÉQUIPE (BUREAU)
   ================================================================== */
function Equipe({ tags, onSetRole }) {
  const [rows, setRows] = useState([]);
  const [err, setErr] = useState("");

  useEffect(() => { load(); }, []);

  async function load() {
    const { data, error } = await db.from("staff_overview").select("*").order("full_name");
    if (error) setErr(error.message); else setRows(data || []);
  }

  const label = (code) => tags.find((t) => t.code === code)?.label || code;
  const total = rows.reduce((n, r) => n + Number(r.hours_this_month || 0), 0);

  return html`
    <div>
      <h1 style="font-size:26px">L'équipe</h1>
      <p class="muted" style="margin-bottom:var(--s4)">
        ${rows.length} encadrants · ${total} heures par semaine engagées ce mois-ci</p>
      ${err && html`<p class="error" style="margin-bottom:var(--s3)">${err}</p>`}

      ${rows.map((r) => html`<div class="card" key=${r.id}>
        <div style="display:flex;gap:var(--s4);align-items:flex-start;flex-wrap:wrap">
          <${Avatar} name=${r.full_name} path=${r.avatar_path} size=${56} />
          <div style="flex:1;min-width:220px">
            <p style="font-size:17px">${r.full_name}<${Role} role=${r.role} /></p>
            <p class="muted">${r.students} élève${r.students > 1 ? "s" : ""} rattaché${r.students > 1 ? "s" : ""}
              ${r.correct_anonymously ? " · corrige sous anonymat" : ""}</p>
            ${(r.subjects || []).length > 0 && html`<div class="tags" style="margin-top:var(--s2)">
              ${r.subjects.map((s) => html`<span key=${s} class="tag">${label(s)}</span>`)}
            </div>`}
          </div>
          <div style="text-align:right;min-width:150px">
            <p style="font-family:var(--serif);font-size:24px">
              ${r.hours_this_month || 0}<span class="muted" style="font-size:13px"> h/sem.</span></p>
            <p class="muted" style="font-size:12px">
              ${r.availability_updated ? `déclaré le ${dateFr(r.availability_updated)}` : "aucun engagement déclaré"}</p>
            ${r.availability_note && html`<p class="muted" style="font-size:12px;font-style:italic">${r.availability_note}</p>`}
            <select value=${r.role} style="margin-top:var(--s2)"
              onChange=${async (e) => { await onSetRole(r.id, e.target.value); await load(); }}>
              <option value="eleve">Élève</option>
              <option value="encadrant">Encadrant</option>
              <option value="admin">Bureau</option>
            </select>
          </div>
        </div>
      </div>`)}

      ${rows.some((r) => !r.hours_this_month) && html`<p class="muted" style="margin-top:var(--s3)">
        Les encadrants sans engagement déclaré ne l'ont pas encore renseigné dans leur profil.</p>`}
    </div>`;
}

/* ==================================================================
   8septies. CARTE DE L'ENCADRANT (VUE ÉLÈVE)

function CarteEncadrant({ tutorId, tags }) {
  const [t, setT] = useState(null);

  useEffect(() => { if (tutorId) load(); }, [tutorId]);

  async function load() {
    const { data } = await db.from("profiles")
      .select("full_name, role, bio, avatar_path, subjects").eq("id", tutorId).single();
    setT(data);
  }

  if (!tutorId) return html`<div class="card">
    <p class="eyebrow" style="margin-bottom:var(--s2)">Ton encadrant</p>
    <p class="muted">Aucun encadrant ne t'est encore rattaché. Le bureau s'en occupe.</p></div>`;

  if (!t) return null;
  const label = (code) => tags.find((x) => x.code === code)?.label || code;

  return html`<div class="card">
    <p class="eyebrow" style="margin-bottom:var(--s3)">Ton encadrant</p>
    <div style="display:flex;gap:var(--s4);align-items:flex-start;flex-wrap:wrap">
      <${Avatar} name=${t.full_name} path=${t.avatar_path} size=${64} />
      <div style="flex:1;min-width:200px">

        ${t.bio
          ? html`<p class="muted" style="margin-top:var(--s2);white-space:pre-wrap">${t.bio}</p>`
          : html`<p class="muted" style="margin-top:var(--s2)">Cet encadrant n'a pas encore rempli sa présentation.</p>`}
        ${(t.subjects || []).length > 0 && html`<div class="tags" style="margin-top:var(--s3)">

        </div>`}
      </div>

}

function Eleves({ me, rows, totalLessons, onOpen, title, subtitle }) {
  return html`
    <div>
      <h1 style="font-size:26px">${title}</h1>
      <p class="muted" style="margin-bottom:var(--s4)">${subtitle}</p>
      ${rows.length === 0
        ? html`<div class="card"><p class="muted">Aucun élève pour l'instant.</p></div>`
        : html`<div class="card" style="padding:0;overflow-x:auto"><table>
            <thead><tr><th>Nom</th><th>Statut</th><th>Leçons</th><th>XP</th><th style="width:150px">Avancement</th><th></th></tr></thead>
            <tbody>${rows.map((r) => {
              const pct = totalLessons ? Math.round((r.lessons_done/totalLessons)*100) : 0;
              return html`<tr key=${r.id}>
                <td>${r.full_name}</td>
                <td><span class=${"pill " + (r.status==="active"?"live":r.status==="pending"?"wait":"off")}>

                <td class="muted">${r.lessons_done} / ${totalLessons}</td>
                <td>${r.xp}</td>
                <td><div style="display:flex;align-items:center;gap:var(--s3)">
                  <div class="track dark" style="flex:1">

                  <span class="muted" style="font-size:12px">${pct} %</span></div></td>
                <td><button class="ghost tiny" onClick=${() => onOpen(r.id)}>Fiche</button></td>
              </tr>`;
            })}</tbody></table></div>`}
